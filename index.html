        </section>`;
      }
      if(secKey==='skills'){
        return `<section data-chrsec="skills" class="card space-y-3" ${winStyle}>
          ${hdrCommon('Fertigkeiten','Marginal: 1/1/2/2+MsP\nFundamental: 2/2/3/3+MsP\nGrandios: 3/2/3/4+MsP\nSP & MsP sind direkt in der Tabelle überschreibbar (z.B. 0 für geschenkte Fertigkeit).',S.skills.length>1?`<button type="button" data-action="sort-skills-az" class="btn py-0.5 px-2.5 text-xs">⇅ A–Z sortieren</button>`:'',`<span id="chrSkBadge" class="pill cursor-default text-emerald-500 tabular">${P.skSp} SP | ${P.skMsp||'-'} MsP</span>`)}
          ${!meta.collapsed?`<form id="formAddSkillChron" class="subcard grid grid-cols-1 sm:grid-cols-12 gap-2 items-end"><div class="sm:col-span-3"><label class="block text-[11px] font-bold t-mut mb-1">Fertigkeit</label><input id="skNameChr" type="text" placeholder="z.B. Etikette (Vhendris)" class="inp w-full"/></div><div class="sm:col-span-2"><label class="block text-[11px] font-bold t-mut mb-1">Attribut</label><select id="skAttrChr" class="inp w-full font-bold">${skAttrOpts('PR')}</select></div><div class="sm:col-span-3"><label class="block text-[11px] font-bold t-mut mb-1">Kategorie</label><select id="skCatChr" class="inp w-full font-semibold">${skCatOpts('fundamental')}</select></div><div class="sm:col-span-2"><label class="block text-[11px] font-bold t-mut mb-1">Grad</label><select id="skRankChr" class="inp w-full font-semibold">${SK_RANKS.map(r=>`<option value="${r.r}" ${r.r===1?'selected':''}>${r.n} (+${r.b})</option>`).join('')}</select></div><div class="sm:col-span-2"><button type="submit" class="btn btn-ok w-full">Speichern</button></div></form>
          <div class="overflow-x-auto"><table class="tbl min-w-[820px] text-xs sm:text-sm tabular"><thead><tr><th class="text-left">${skSortBtn('name','Fertigkeit','text-left','Alphabetisch sortieren (auf-/absteigend)')}</th><th class="text-left">${skSortBtn('attr','Attribut','text-left','Nach Attribut &amp; höchstem Wert zuerst sortieren')}</th><th class="text-left">${skSortBtn('cat','Kategorie','text-left','Nach Kategorie sortieren')}</th><th class="text-left">${skSortBtn('rank','Grad &amp; Bonus (Overwrite)','text-left','Nach Grad sortieren (klein nach groß / groß nach klein)')}</th><th class="text-center">${skSortBtn('sp','SP (editierbar)','text-center','Nach SP-Kosten sortieren')}</th><th class="text-center">${skSortBtn('msp','MsP','text-center','Nach MsP-Kosten sortieren')}</th><th class="text-left">Notizen</th><th></th></tr></thead><tbody>${renderSkillRows(true)}</tbody></table></div>`:''}
        </section>`;
      }
      return `<section data-chrsec="powers" class="card space-y-3" ${winStyle}>
        ${hdrCommon('Kräfte &amp; Augmente','Marginal: 1 SP • Fundamental: 2 SP • Grandios: 2 SP + 1 MsP\nZiehe Zeilen an ⠿ per Drag & Drop zum Sortieren.','',`<button type="button" data-action="add-power" class="btn py-1 px-2.5 text-xs">+ Kraft</button><button type="button" data-action="add-augment" class="btn py-1 px-2.5 text-xs border-amber-400/60 text-amber-500">+ Augment</button><span id="chrPwBadge" class="pill cursor-default text-acc tabular">${P.pwSp} SP | ${P.pwMsp||'-'} MsP</span>`)}
        ${!meta.collapsed?`<div id="chrPwCats" class="flex flex-wrap gap-2">${buildPwCatPillsHtml()}</div>
        <div class="overflow-x-auto"><table class="tbl min-w-[780px] text-xs sm:text-sm tabular"><thead><tr><th class="text-left w-44">⠿ Typ</th><th class="text-left">Name</th><th class="text-left w-60">Kategorie</th><th class="text-center w-24">SP</th><th class="text-center w-24">MsP</th><th class="text-right w-40">Status</th></tr></thead><tbody>${allPw.length?allPw.map(({kind,lbl,it})=>{const c=calcPwCost(it),isAug=kind==='augment',par=isAug&&it.parentPowerId?S.powers.find(p=>p.id===it.parentPowerId):null,listArr=isAug?S.augments:S.powers,idx=listArr.indexOf(it);return `<tr data-chr-pw="${kind}:${it.id}" ${it.bgColor?`style="background:color-mix(in srgb,${esc(it.bgColor)} 22%,transparent)"`:''}><td><div class="flex items-center gap-1.5"><span draggable="true" data-drag-chr-pw="${kind}:${it.id}" data-tip="Ziehen zum Sortieren in der Steigerungschronik" class="px-1.5 py-0.5 rounded bg-black/20 border bdr-line t-mut text-xs font-black cursor-grab select-none shrink-0">⠿</span>${listArr.length>1?`<span class="inline-flex flex-col leading-none shrink-0"><button type="button" data-action="move-chr-pw" data-kind="${kind}" data-id="${it.id}" data-dir="-1" ${idx===0?'disabled':''} class="text-[9px] t-mut hover:text-acc disabled:opacity-25">▲</button><button type="button" data-action="move-chr-pw" data-kind="${kind}" data-id="${it.id}" data-dir="1" ${idx===listArr.length-1?'disabled':''} class="text-[9px] t-mut hover:text-acc disabled:opacity-25">▼</button></span>`:''}<div><span class="px-2 py-0.5 rounded text-[10px] font-black ${isAug?'bg-amber-500/15 text-amber-400 border border-amber-500/40':'bg-acc-soft text-acc border bdr-acc'}">${lbl}</span>${par?`<div class="text-[10px] t-mut truncate mt-0.5 max-w-[110px]">↳ ${esc(par.name||'Kraft')}</div>`:''}</div></div></td><td><div class="flex items-center gap-1.5"><input data-pwf="${kind}:${it.id}:name" type="text" value="${esc(it.name)}" ${it.color?`style="color:${esc(it.color)}"`:''} placeholder="Unbenannt..." class="inp-line w-full font-bold"/><button type="button" data-action="open-pw-color" data-kind="${kind}" data-id="${it.id}" data-cmode="text" data-tip="Textfarbe" class="btn w-6 h-6 p-0 text-[10px] shrink-0">🎨</button><button type="button" data-action="open-pw-color" data-kind="${kind}" data-id="${it.id}" data-cmode="bg" data-tip="Fensterfarbe" class="btn w-6 h-6 p-0 text-[10px] shrink-0">🪟</button></div></td><td>${renderPwCostSelect(kind,it)}</td><td class="text-center"><input data-pwcost="${kind}:${it.id}:sp" type="text" inputmode="numeric" value="${c.sp}" class="inp w-16 text-center py-0.5 px-1 font-extrabold ${it.manualCost?'!border-amber-400 text-amber-300':''}"/></td><td class="text-center"><input data-pwcost="${kind}:${it.id}:msp" type="text" inputmode="numeric" value="${c.msp}" class="inp w-16 text-center py-0.5 px-1 font-extrabold ${c.msp?'text-amber-400':''}"/></td><td class="text-right"><div class="inline-flex items-center justify-end gap-1"><button type="button" data-action="gift-pw" data-kind="${kind}" data-id="${it.id}" data-tip="${it.manualCost&&c.sp===0&&c.msp===0?'Geschenkt aktiv (0 SP) – Klicken für Standardkosten':'Geschenkt (0 SP) – Toggle'}" class="btn py-0.5 px-1.5 text-[10px] ${it.manualCost&&c.sp===0&&c.msp===0?'btn-ok':''}">🎁</button>${it.manualCost?`<span class="text-[10px] font-extrabold text-amber-400">Manuell</span>`:''}${renderDelConfirm(kind,it.id,true)}</div></td></tr>`;}).join(''):`<tr><td colspan="6" class="text-center text-xs t-mut py-3">Keine Kräfte oder Augmente vorhanden.</td></tr>`}</tbody></table></div>`:''}
      </section>`;
    }

    function tplChronicle(){
      const P=calcProg(), activeTrRows=[];
      let trainedAttrCnt=0;
      ATTRS.forEach(a=>{
        const actBlocks=TR_DEFS.filter(b=>S.attributes[a.k].tr[b.i]);
        if(!actBlocks.length) return;
        trainedAttrCnt++;
        const col=getAttrCol(a.k), sumBon=getTrBonus(a.k), isExp=Boolean(S.chrTrExpanded?.[a.k]);
        let sumSp=0, sumMsp=0, sumDefSp=0, sumDefMsp=0, anyManual=false, allGift=true;
        actBlocks.forEach(b=>{
          const tc=getTrCost(a.k,b.i);
          sumSp+=tc.sp; sumMsp+=tc.msp; sumDefSp+=tc.defSp; sumDefMsp+=tc.defMsp;
          if(tc.manual) anyManual=true;
          if(!(tc.manual&&tc.sp===0&&tc.msp===0)) allGift=false;
        });
        const rangeLbl=actBlocks.length===1?`Stufe ${actBlocks[0].i+1}`:`Stufe 1–${actBlocks[actBlocks.length-1].i+1} (${actBlocks.length}×)`;
        const notesArr=actBlocks.map(b=>String(S.attributes[a.k].trNotes[b.i]||'').trim()).filter(Boolean);
        const notesPreview=notesArr.length?notesArr.join(' • '):'';
        activeTrRows.push(`<tr class="bg-black/15" style="border-left:3px solid ${col}">
          <td>
            <div class="flex items-center gap-2">
              <button type="button" data-action="toggle-tr-grp" data-attr="${a.k}" data-tip="${isExp?'Einzelne Stufen einklappen':'Einzelne Stufen aufklappen & bearbeiten'}" class="btn w-6 h-6 p-0 text-xs font-black shrink-0">${isExp?'▾':'▸'}</button>
              <button type="button" data-action="toggle-tr-grp" data-attr="${a.k}" class="text-left flex flex-wrap items-center gap-1.5 hover:opacity-85">
                <span class="font-black" style="color:${col}">${a.k}</span>
                <span class="font-extrabold">${a.n}</span>
                <span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-black/25 t-mut">${rangeLbl}</span>
              </button>
            </div>
          </td>
          <td id="trSumBon_${a.k}" class="text-center font-black text-acc">+${sumBon}</td>
          <td class="text-center"><span id="trSumSp_${a.k}" data-tip="Summe der SP-Kosten für ${a.n} (Standard: ${sumDefSp} SP)\nKlicke auf ▸ zum Aufklappen der Einzelstufen." class="px-2.5 py-0.5 rounded-lg border text-xs font-black inline-block min-w-[3.5rem] ${anyManual?'border-amber-400/70 bg-amber-500/15 text-amber-300':'bdr-line bg-black/20 text-acc'}">${sumSp} SP</span></td>
          <td class="text-center"><span id="trSumMsp_${a.k}" class="px-2 py-0.5 rounded-lg text-xs font-black ${sumMsp?'text-amber-400 bg-amber-500/15 border border-amber-400/50':'t-mut'}">${sumMsp||0}</span></td>
          <td class="text-center">
            <div class="inline-flex items-center gap-1">
              <button type="button" data-action="gift-tr-attr" data-attr="${a.k}" data-tip="${allGift?`Geschenkt aktiv (0 SP) – Klicken für Standardkosten (${sumDefSp} SP${sumDefMsp?` + ${sumDefMsp} MsP`:''})`:`Alle aktiven Stufen von ${a.n} als geschenkt setzen (0 SP / 0 MsP) – Toggle`}" class="btn py-0.5 px-1.5 text-[10px] ${allGift?'btn-ok':''}">🎁</button>
              ${anyManual?`<span class="text-[10px] font-extrabold text-amber-400">Manuell</span>`:''}
            </div>
          </td>
          <td>
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs t-mut truncate max-w-[260px]">${notesPreview?esc(notesPreview):`<span class="opacity-60 italic">${isExp?'Einzelstufen unten bearbeitbar':`Zusammengefasst (${actBlocks.length} ${actBlocks.length===1?'Stufe':'Stufen'})`}</span>`}</span>
              <button type="button" data-action="toggle-tr-grp" data-attr="${a.k}" class="btn py-0.5 px-2 text-[10px] shrink-0">${isExp?'▴ Einklappen':`▾ Stufen (${actBlocks.length})`}</button>
            </div>
          </td>
        </tr>`);
        if(isExp){
          actBlocks.forEach(b=>{
            const tc=getTrCost(a.k,b.i);
            activeTrRows.push(`<tr style="border-left:3px solid ${col};background:color-mix(in srgb,${col} 7%,transparent)">
              <td class="pl-8 font-bold text-xs"><span class="t-mut mr-1">↳</span>${a.k} ${b.i+1} <span class="text-[11px] font-normal t-mut">(Stufe ${b.i+1})</span></td>
              <td class="text-center font-bold text-acc text-xs">+${b.b}</td>
              <td class="text-center"><input data-trcost="${a.k}:${b.i}:sp" type="text" inputmode="numeric" value="${tc.sp}" data-tip="SP-Kosten für ${a.k} Block ${b.i+1} direkt überschreiben (Standard: ${tc.defSp} SP)" class="inp w-14 text-center py-0.5 px-1 font-extrabold ${tc.manual?'!border-amber-400 text-amber-300':''}"/></td>
              <td class="text-center"><input data-trcost="${a.k}:${b.i}:msp" type="text" inputmode="numeric" value="${tc.msp}" data-tip="MsP-Kosten direkt überschreiben (Standard: ${tc.defMsp} MsP)" class="inp w-14 text-center py-0.5 px-1 font-extrabold ${tc.msp?'text-amber-400':''}"/></td>
              <td class="text-center"><div class="inline-flex items-center gap-1"><button type="button" data-action="gift-tr" data-attr="${a.k}" data-idx="${b.i}" data-tip="${tc.manual&&tc.sp===0&&tc.msp===0?`Geschenkt aktiv (0 SP) – Klicken für Standardkosten (${tc.defSp} SP)`:'Als geschenkt setzen (0 SP / 0 MsP) – Toggle'}" class="btn py-0.5 px-1.5 text-[10px] ${tc.manual&&tc.sp===0&&tc.msp===0?'btn-ok':''}">🎁</button>${tc.manual?`<span class="text-[10px] font-extrabold text-amber-400">Manuell</span>`:''}</div></td>
              <td><input data-trnote="${a.k}:${b.i}" type="text" value="${esc(S.attributes[a.k].trNotes[b.i])}" placeholder="Notiz zu ${a.k} ${b.i+1}..." class="inp-line w-full text-xs"/></td>
            </tr>`);
          });
        }
      });
      const allPw=[...S.powers.filter(p=>p.tier!=='basisaktion').map(p=>({kind:'power',lbl:'Kraft',it:p})),...S.augments.filter(a=>a.tier!=='basisaktion').map(a=>({kind:'augment',lbl:'Augment',it:a}))];
      const ord=Array.isArray(S.chrSecOrder)&&S.chrSecOrder.length===3?S.chrSecOrder:DEF_CHR_SEC_ORDER;
      return `<section class="card space-y-4"><div class="flex flex-wrap items-center justify-between gap-2"><h2 class="text-base sm:text-lg font-extrabold cursor-help" data-tip="Je 100 EP = +1 Stufe (mit Rest-Übertrag)\nPro Stufe = +5 SP • Jede 10. Stufe = +1 MsP">Steigerungschronik – Stufe, EP, SP &amp; MsP</h2><div class="flex flex-wrap gap-1.5"><button type="button" data-action="collapse-all-chr" data-val="1" class="btn py-1 px-2.5 text-xs">▸ Alle Fenster einklappen</button><button type="button" data-action="collapse-all-chr" data-val="0" class="btn py-1 px-2.5 text-xs">▾ Alle Fenster ausklappen</button></div></div>

        <div class="subcard flex flex-col justify-between"><div class="flex items-center justify-between"><span class="text-xs font-extrabold text-amber-500">EP (0–99)</span><div class="flex items-center gap-1 text-xs font-bold"><input id="inpDirectEp" type="text" inputmode="numeric" value="${S.progression.ep}" class="inp w-14 text-right py-0.5 px-1.5 font-bold"/><span class="t-mut">/ 100</span></div></div><div class="w-full h-2 rounded-full bg-black/25 overflow-hidden my-2"><div class="h-full accent-bar" style="width:${Math.min(100,Math.max(0,S.progression.ep))}%"></div></div><form id="formAddEp" class="flex gap-1.5"><input id="inpAddEp" type="text" inputmode="numeric" placeholder="+ EP (z.B. 65)" class="inp w-full py-1 text-xs font-bold"/><button type="submit" class="btn bg-amber-500 text-slate-950 border-amber-500">+ EP</button></form></div>
        <div id="chrSpBox" class="subcard flex flex-col justify-between ${P.spRem<0?'!border-rose-500 !bg-rose-500/15 text-rose-500':''}"><span class="text-xs font-extrabold">SP vergeben / übrig</span><div class="my-1"><div class="text-2xl font-black"><span id="chrSpRem">${P.spRem}</span> <span class="text-xs font-bold opacity-75">übrig</span></div><div class="text-xs font-semibold">Vergeben: <strong id="chrSpSpent">${P.spSpent}</strong> / <strong id="chrSpTot">${P.totSp}</strong></div></div><div id="chrSpBreak" class="text-[11px] opacity-75">Tr: ${P.trSp} • Fert.: ${P.skSp} • Kräfte: ${P.pwSp}${P.spMod?` • <span class="text-emerald-400 font-bold" data-tip="${esc('SP-Mod durch Kraft-Effekte:\n'+P.spModSrc)}">SP-Mod: ${fmtSign(P.spMod)}</span>`:''}</div></div>
        <div id="chrMspBox" class="subcard flex flex-col justify-between ${P.mspRem<0?'!border-rose-500 !bg-rose-500/15 text-rose-500':''}"><span class="text-xs font-extrabold">MsP vergeben / übrig</span><div class="my-1"><div class="text-2xl font-black"><span id="chrMspRem">${P.mspRem}</span> <span class="text-xs font-bold opacity-75">übrig</span></div><div class="text-xs font-semibold">Vergeben: <strong id="chrMspSpent">${P.mspSpent}</strong> / <strong id="chrMspTot">${P.totMsp}</strong></div></div><div id="chrMspBreak" class="text-[11px] opacity-75">Tr: ${P.trMsp} • Fert.: ${P.skMsp} • Kräfte: ${P.pwMsp}</div></div>
      </div>
      <div class="subcard grid grid-cols-1 md:grid-cols-12 gap-3 items-end bdr-acc"><div class="md:col-span-3"><label class="block text-xs font-bold text-acc mb-1">Bonus-SP</label><input data-prog="bonusSp" type="text" inputmode="numeric" value="${esc(S.progression.bonusSp)}" class="inp w-full font-extrabold tabular"/></div><div class="md:col-span-3"><label class="block text-xs font-bold text-amber-500 mb-1">Bonus-MsP</label><input data-prog="bonusMsp" type="text" inputmode="numeric" value="${esc(S.progression.bonusMsp)}" class="inp w-full font-extrabold tabular"/></div><div class="md:col-span-6"><label class="block text-xs font-bold t-mut mb-1">Quelle / Notiz</label><input data-prog="bonusNote" type="text" value="${esc(S.progression.bonusNote)}" placeholder="z.B. Volk Mensch (+5 Start-SP)" class="inp w-full"/></div></div></section>
      <div class="space-y-5">
        ${ord.map((secKey,sIdx)=>renderChrSection(secKey,sIdx,ord.length,P,activeTrRows,trainedAttrCnt,allPw)).join('')}
      </div>
      <section class="card space-y-3"><div class="flex items-center justify-between"><h3 class="text-base font-extrabold">Steigerungschronik-Logbuch</h3>${UI.confirmLog?`<div class="flex gap-1.5"><button type="button" data-action="clear-log-yes" class="btn bg-rose-600 text-white">Endgültig löschen (2/2)</button><button type="button" data-action="clear-log-no" class="btn">Abbrechen</button></div>`:`<button type="button" data-action="clear-log-ask" class="btn btn-err">Logbuch löschen</button>`}</div>
      <form id="formLogNote" class="flex gap-2"><input id="inpLogNote" type="text" placeholder="Eigene Notiz ins Chronik-Log eintragen..." class="inp flex-1"/><button type="submit" class="btn btn-pri">+ Eintrag</button></form>
      <div class="space-y-1.5 max-h-72 overflow-y-auto pr-1">${S.chronicleLog.map(e=>`<div class="subcard py-1.5 px-3 flex flex-col sm:flex-row sm:justify-between gap-1 text-xs"><span>${esc(e.text)}</span><span class="text-[11px] t-mut tabular shrink-0">${esc(e.ts)}</span></div>`).join('')}</div></section>`;
    }

    function renderItemImgBox(kind,id,imgUrl,small=false){
      const sz=small?'w-8 h-8 rounded-lg':'w-12 h-12 rounded-xl';
      return `<div class="relative shrink-0">
        <button type="button" data-action="pick-item-img" data-kind="${kind}" data-id="${id}" data-tip="Bild für diesen Gegenstand hochladen" class="${sz} overflow-hidden border bdr-acc bg-acc-soft flex items-center justify-center cursor-pointer shadow-sm">${imgUrl?`<img src="${imgUrl}" class="w-full h-full object-cover"/>`:`<span class="text-[10px] font-black text-acc leading-none text-center">🖼${small?'':'<br/>+'}</span>`}</button>
        ${imgUrl&&!small?`<button type="button" data-action="rm-item-img" data-kind="${kind}" data-id="${id}" data-tip="Bild entfernen" class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-rose-600 text-white text-[9px] font-black flex items-center justify-center shadow">✕</button>`:''}
      </div>`;
    }

    function renderEqTagBar(kind,item,tagList,ltype,lbl){
      const usedNames=(item.tags||[]).map(t=>t.name.toLowerCase());
      const avail=(tagList||[]).filter(t=>!usedNames.includes(t.name.toLowerCase()));
      return `<div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold t-mut">${lbl}</span>
          <button type="button" data-action="open-list" data-ltype="${ltype}" data-tip="Standardliste „${lbl}“ verwalten &amp; eigene Tags hinzufügen" class="text-[11px] text-acc hover:underline">⚙️ Liste bearbeiten</button>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          ${(item.tags||[]).map((tg,ti)=>{
            const isX=hasTagX(tg.name), tip=esc(getTagDesc(tagList,tg.name,tg.x)), baseLbl=String(tg.name).replace(/\(\s*X\s*\)/i,'').trim();
            return `<span id="eqtag_${kind}_${item.id}_${ti}" data-tip="${tip}" class="tag cursor-help py-1 px-2 text-xs">
              <span>${esc(baseLbl)}</span>
              ${isX?`<span class="inline-flex items-center gap-0.5 font-black">(<input data-eqtag-x="${kind}:${item.id}:${ti}" type="text" value="${esc(tg.x??'1')}" class="inp !py-0 !px-1 w-9 text-center text-[11px] font-black tabular"/>)</span>`:''}
              <button type="button" data-action="rm-eq-tag" data-kind="${kind}" data-id="${item.id}" data-tidx="${ti}" class="hover:text-rose-400 font-black ml-0.5">✕</button>
            </span>`;
          }).join('')}
          <select data-add-eqtag="${kind}:${item.id}" data-tip="Wähle einen Tag aus der alphabetischen Liste (oder füge über ⚙️ eigene hinzu)" class="inp py-1 px-2 text-xs font-semibold ${(item.tags||[]).length?'w-auto':'w-full'}">
            <option value="">+ ${lbl} hinzufügen...</option>
            ${avail.map(t=>`<option value="${esc(t.name)}" title="${esc(t.desc||t.name)}">${esc(t.name)}${t.desc?` — ${esc(t.desc.length>55?t.desc.slice(0,55)+'…':t.desc)}`:''}</option>`).join('')}
          </select>
        </div>
      </div>`;
    }

    function renderEqColorAndMoveBtns(kind,it,idx,len,delAct){
      return `<div class="flex items-center gap-1 shrink-0">
        <button type="button" data-action="open-eq-color" data-kind="${kind}" data-id="${it.id}" data-cmode="text" data-tip="Textfarbe (Name) anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${it.color?`style="border-color:${esc(it.color)}"`:''}>🎨</button>
        <button type="button" data-action="open-eq-color" data-kind="${kind}" data-id="${it.id}" data-cmode="bg" data-tip="Fensterfarbe (Hintergrund) anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${it.bgColor?`style="border-color:${esc(it.bgColor)};background:color-mix(in srgb,${esc(it.bgColor)} 35%,var(--surf2))"`:''}>🪟</button>
        ${len>1?`<button type="button" data-action="move-eqitem" data-kind="${kind}" data-id="${it.id}" data-dir="-1" ${idx===0?'disabled':''} class="btn py-1 px-2 text-xs">▲</button><button type="button" data-action="move-eqitem" data-kind="${kind}" data-id="${it.id}" data-dir="1" ${idx===len-1?'disabled':''} class="btn py-1 px-2 text-xs">▼</button>`:''}
        <button type="button" data-action="${delAct}" data-id="${it.id}" data-tip="Entfernen" class="btn btn-err py-1 px-2 text-xs">✕</button>
      </div>`;
    }

    function renderWeaponRollBtns(w,wm,compact=false){
      const M=calcActiveMods(), wRaw=String(w.name||'').trim()||(w.wType==='ranged'?'Fernkampfwaffe':'Nahkampfwaffe'), wLbl=esc(wRaw);
      const poolBreak=`${wm.attrKey} ${wm.attrVal}${wm.sk?` ${fmtSign(wm.skBonus)} (${wm.sk.name})`:' + 0 (ohne Fertigkeit)'} = ${wm.pool}`;
      const wTip=cat=>{const ad=getAdvDisForContext({weaponId:w.id,wRollCat:cat,skillId:wm.sk?.id||null,attrKey:wm.attrKey},M),al=fmtAdvSrcLines(ad.src),cl=(ad.critSrc||[]).map(c=>`• ${c.srcName}: Kritische Ziffer +${c.val}`).join('\n'),sl=(ad.sitOptions||[]).map(s=>`• [Situativ] ${s.sitLabel}: ${s.reduceDis?'-'+s.reduceDis+'N':s.adv?'+'+s.adv+'V':'+'+s.dis+'N'}${s.counterNote?' ('+s.counterNote+')':''}`).join('\n');return esc(`${cat} mit ${wRaw} starten\nPool: ${poolBreak}${cat==='Blocken'&&wm.hasBlock?'\n✓ Tag Blockfähig aktiv':''}${al?'\n'+al:''}${cl?'\n'+cl:''}${sl?'\n'+sl:''}`);};
      return `<div class="inline-flex flex-wrap items-center gap-1.5 tabular shrink-0">
        <button type="button" data-action="roll-weapon" data-id="${w.id}" data-wcat="Trefferwurf" data-tip="${wTip('Trefferwurf')}" class="btn btn-pri ${compact?'py-1 px-2.5 text-xs':'py-1.5 px-3 text-xs'} font-black">🎲 Trefferwurf <span class="px-1.5 py-0.5 rounded bg-black/25 text-[11px] font-black">${wm.pool}</span></button>
        <div class="inline-flex items-center rounded-lg border bdr-acc bg-acc-soft overflow-hidden shrink-0" role="group">
          <button type="button" data-action="roll-weapon" data-id="${w.id}" data-wcat="Parieren" data-tip="${wTip('Parieren')}" class="px-2 ${compact?'py-1':'py-1.5'} text-[11px] font-extrabold text-acc hover:bg-black/20 transition-colors cursor-pointer">🛡️ Parieren</button>
          <span class="w-px self-stretch bg-white/15"></span>
          <button type="button" data-action="roll-weapon" data-id="${w.id}" data-wcat="Blocken" data-tip="${wTip('Blocken')}" class="px-2 ${compact?'py-1':'py-1.5'} text-[11px] font-extrabold ${wm.hasBlock?'text-emerald-400':'text-acc opacity-85'} hover:bg-black/20 transition-colors cursor-pointer">Blocken</button>
        </div>
      </div>`;
    }
    function renderWeaponCard(w,idx,len){
      const M=calcActiveMods(), wm=getWeaponRollMeta(w,M);
      const isRng=w.wType==='ranged', linkedAmmo=isRng&&w.ammoId?S.ammos.find(a=>a.id===w.ammoId):null;
      const colStyle=w.color?`style="color:${esc(w.color)}"`:'', winStyle=cardColorStyle(w);

        return `<div data-eqitem="weapon:${w.id}" class="subcard py-2 px-3 flex flex-wrap items-center justify-between gap-2" ${winStyle}>
          <div class="flex items-center gap-2 flex-1 min-w-[180px]">
            <button type="button" data-action="toggle-eqitem-collapse" data-kind="weapon" data-id="${w.id}" data-tip="Waffe ausklappen" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">▸</button>
            <span draggable="true" data-drag-eqitem="weapon:${w.id}" data-tip="Ziehen zum Sortieren" class="w-7 h-7 rounded bg-acc-soft border bdr-acc text-acc text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>
            ${renderItemImgBox('weapon',w.id,w.img,true)}

          </div>
          <div class="flex flex-wrap items-center gap-1.5 tabular">
            ${renderWeaponRollBtns(w,wm,true)}
            <span class="pill cursor-default text-[11px] py-0.5 px-2">${isRng?'🏹 Fernkampf':'⚔️ Nahkampf'}</span>
            ${w.grip?`<span class="pill cursor-default text-[11px] py-0.5 px-2 text-acc">${w.grip==='1h'?'Einhändig':'Zweihändig'}</span>`:''}
            <span class="pill cursor-default text-[11px] py-0.5 px-2">Schnitt ${esc(w.dmgCut)} • Durchstoß ${esc(w.dmgPierce)} • Einschlag ${esc(w.dmgImpact)}</span>
            ${linkedAmmo?`<span class="pill cursor-default text-[11px] py-0.5 px-2 text-amber-400">🎯 ${esc(linkedAmmo.name||'Munition')}: ${linkedAmmo.qty}</span>`:''}
            ${renderEqColorAndMoveBtns('weapon',w,idx,len,'del-weapon')}
          </div>
        </div>`;
      }
      return `<div data-eqitem="weapon:${w.id}" class="subcard space-y-2.5" ${winStyle}>
        <div class="flex flex-wrap items-center gap-2.5">
          <button type="button" data-action="toggle-eqitem-collapse" data-kind="weapon" data-id="${w.id}" data-tip="Waffe einklappen (nur Titelzeile)" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">▾</button>
          <span draggable="true" data-drag-eqitem="weapon:${w.id}" data-tip="Ziehen zum Sortieren der Waffe" class="w-7 h-7 rounded bg-acc-soft border bdr-acc text-acc text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>
          ${renderItemImgBox('weapon',w.id,w.img)}
          <div class="flex-1 min-w-[160px]">
            <label class="block text-[10px] font-bold t-mut">WAFFENNAME</label>
            <input data-wpf="${w.id}:name" type="text" value="${esc(w.name)}" ${colStyle} placeholder="z.B. Langschwert, Kompositbogen..." class="inp-line w-full text-sm sm:text-base font-extrabold"/>
          </div>
          <div>
            <label class="block text-[10px] font-bold t-mut">WAFFENTYP</label>
            <select data-wp-sel="${w.id}:wType" class="inp py-1 px-2 text-xs font-bold">
              <option value="melee" ${!isRng?'selected':''}>⚔️ Nahkampfwaffe</option>
              <option value="ranged" ${isRng?'selected':''}>🏹 Fernkampfwaffe</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold t-mut">FÜHRUNG</label>
            <div class="inline-flex items-center gap-1">
              <button type="button" data-action="set-wp-grip" data-id="${w.id}" data-grip="1h" data-tip="Einhändig geführt (schließt Zweihändig aus)" class="btn py-1 px-2 text-xs ${w.grip==='1h'?'btn-ok':'opacity-75'}"><span class="inline-flex items-center justify-center w-3.5 h-3.5 rounded border ${w.grip==='1h'?'border-white bg-white/20':'bdr-line'} text-[10px] font-black">${w.grip==='1h'?'✓':''}</span>Einhändig</button>
              <button type="button" data-action="set-wp-grip" data-id="${w.id}" data-grip="2h" data-tip="Zweihändig geführt (schließt Einhändig aus)" class="btn py-1 px-2 text-xs ${w.grip==='2h'?'btn-ok':'opacity-75'}"><span class="inline-flex items-center justify-center w-3.5 h-3.5 rounded border ${w.grip==='2h'?'border-white bg-white/20':'bdr-line'} text-[10px] font-black">${w.grip==='2h'?'✓':''}</span>Zweihändig</button>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-1.5 tabular">
            <div class="text-center"><label class="block text-[10px] font-bold t-mut" data-tip="Schnittschaden-Bonus (Ganze Zahl oder - für nicht möglich)">Schnitt</label><input data-wpf="${w.id}:dmgCut" type="text" value="${esc(w.dmgCut)}" placeholder="-" class="inp w-14 text-center font-black py-1 px-1 text-xs"/></div>
            <div class="text-center"><label class="block text-[10px] font-bold t-mut" data-tip="Durchstoßschaden-Bonus (Ganze Zahl oder - für nicht möglich)">Durchstoß</label><input data-wpf="${w.id}:dmgPierce" type="text" value="${esc(w.dmgPierce)}" placeholder="-" class="inp w-14 text-center font-black py-1 px-1 text-xs"/></div>
            <div class="text-center"><label class="block text-[10px] font-bold t-mut" data-tip="Einschlagschaden-Bonus (Ganze Zahl oder - für nicht möglich)">Einschlag</label><input data-wpf="${w.id}:dmgImpact" type="text" value="${esc(w.dmgImpact)}" placeholder="-" class="inp w-14 text-center font-black py-1 px-1 text-xs"/></div>
          </div>
          ${renderEqColorAndMoveBtns('weapon',w,idx,len,'del-weapon')}
        </div>
        <div class="p-2.5 rounded-xl border bdr-acc bg-acc-soft/30 flex flex-wrap items-end justify-between gap-2.5">
          <div class="flex flex-wrap items-end gap-2.5 flex-1 min-w-[240px]">
            <div>
              <label class="block text-[10px] font-extrabold text-acc mb-0.5" data-tip="Pflicht-Attribut für Würfe mit dieser Waffe (Standard: PR bei Fernkampf, ST oder PR bei Nahkampf; wechselt bei Tag „Massiv“ automatisch auf ST)">ATTRIBUT ${wm.hasMassiv?`<span class="text-amber-400">• Massiv → ST</span>`:`<span class="t-mut font-semibold">(${isRng?'Std: PR':'Std: ST/PR'})</span>`}</label>
              <select data-wp-sel="${w.id}:wAttr" class="inp py-1 px-2 text-xs font-extrabold tabular ${wm.hasMassiv?'!border-amber-400/70 text-amber-300':''}">
                ${ATTRS.map(a=>`<option value="${a.k}" ${wm.attrKey===a.k?'selected':''}>${a.k} – ${a.n} (${getAttrTot(a.k,M)})</option>`).join('')}
              </select>
            </div>
            <div class="flex-1 min-w-[175px] max-w-xs">
              <label class="block text-[10px] font-bold t-mut mb-0.5" data-tip="Optionale Verknüpfung mit einer gelernten Charakter-Fertigkeit aus Reiter 2">FERTIGKEIT (OPTIONAL)</label>
              <select data-wp-sel="${w.id}:skillId" class="inp w-full py-1 px-2 text-xs font-bold tabular">
                <option value="" ${!wm.sk?'selected':''}>— Keine Fertigkeit (+0) —</option>
                ${S.skills.map(sk=>`<option value="${sk.id}" ${wm.sk?.id===sk.id?'selected':''}>${esc(sk.name||'Unbenannt')} (${fmtSign(getSkBonus(sk))} • ${SK_RANKS[sk.rank]?.n||'Grad '+sk.rank})</option>`).join('')}

            </div>
          </div>
          ${renderWeaponRollBtns(w,wm,false)}
        </div>
        ${isRng?`<div class="p-2.5 rounded-xl border border-amber-500/35 bg-amber-500/10 space-y-2 text-xs">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="font-extrabold text-amber-400">🎯 Munition:</span>
              <select data-wp-sel="${w.id}:ammoId" class="inp py-1 px-2 text-xs font-bold min-w-[180px]">
                <option value="" ${!w.ammoId?'selected':''}>— Keine Munition zugeordnet —</option>
                ${S.ammos.map(am=>`<option value="${am.id}" ${w.ammoId===am.id?'selected':''}>${esc(am.name||'Unbenannte Munition')} (Vorrat: ${am.qty})</option>`).join('')}
              </select>
              <button type="button" data-action="quick-new-ammo" data-wid="${w.id}" data-tip="Neue Munition direkt erstellen &amp; dieser Waffe zuordnen" class="btn py-1 px-2 text-[11px] border-amber-400/50 text-amber-300">+ Neue Munition</button>
              <button type="button" data-action="open-ammo-modal" data-wid="${w.id}" data-tip="Munitions-Liste bearbeiten (Benennung &amp; Anzahl direkt verwalten)" class="btn py-1 px-2 text-[11px]">⚙️ Liste bearbeiten</button>
            </div>
            ${linkedAmmo?`<div class="flex flex-wrap items-center gap-1.5 tabular">

              <input data-amf="${linkedAmmo.id}:qty" type="text" inputmode="numeric" value="${esc(linkedAmmo.qty)}" data-tip="Vorrat manuell überschreiben" class="inp w-14 text-center font-black py-0.5 px-1 text-xs border-amber-400/50 text-amber-300"/>
              <button type="button" data-action="ammo-step" data-id="${linkedAmmo.id}" data-delta="1" class="btn w-7 h-7 p-0">+</button>
              <button type="button" data-action="ammo-step" data-id="${linkedAmmo.id}" data-delta="-1" class="btn bg-amber-500 text-slate-950 border-amber-400 py-1 px-2.5 text-[11px] font-black">🏹 −1 Schuss</button>
            </div>`:''}
          </div>
          ${linkedAmmo?`<div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 border-t border-amber-500/25">
            <div class="flex flex-wrap items-center gap-1.5 tabular">
              <span class="text-[11px] font-bold t-mut">Munitions-Schaden:</span>
              <span class="px-2 py-0.5 rounded-md bg-black/25 border bdr-line text-[11px] font-semibold">Schnitt: <strong class="text-amber-300 font-black">${esc(linkedAmmo.dmgCut)}</strong></span>
              <span class="px-2 py-0.5 rounded-md bg-black/25 border bdr-line text-[11px] font-semibold">Durchstoß: <strong class="text-amber-300 font-black">${esc(linkedAmmo.dmgPierce)}</strong></span>
              <span class="px-2 py-0.5 rounded-md bg-black/25 border bdr-line text-[11px] font-semibold">Einschlag: <strong class="text-amber-300 font-black">${esc(linkedAmmo.dmgImpact)}</strong></span>

            ${(linkedAmmo.tags||[]).length?`<div class="flex flex-wrap items-center gap-1">${linkedAmmo.tags.map(tg=>`<span data-tip="${esc(getTagDesc(S.ammoTagList,tg.name,tg.x))}" class="tag !border-amber-400/45 !bg-amber-500/15 !text-amber-300 cursor-help">${esc(fmtTagLabel(tg.name,tg.x))}</span>`).join('')}</div>`:''}

          </div>
        </div>
      </div>`;
    }

    function renderAmmoCard(am,idx,len){
      const colStyle=am.color?`style="color:${esc(am.color)}"`:'', winStyle=cardColorStyle(am);
      if(am.collapsed){
        return `<div data-eqitem="ammo:${am.id}" class="subcard py-2 px-3 border-amber-500/30 flex flex-wrap items-center justify-between gap-2" ${winStyle}>

      }
      return `<div data-eqitem="ammo:${am.id}" class="subcard space-y-2.5 border-amber-500/30" ${winStyle}>

          </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-2.5 items-start pt-1 border-t bdr-line">

          <div class="lg:col-span-5">
            <label class="block text-[11px] font-bold t-mut mb-1">Notizen</label>

        return `<div data-eqitem="armor:${ar.id}" class="subcard py-2 px-3 border-emerald-500/30 flex flex-wrap items-center justify-between gap-2" ${winStyle}>
          <div class="flex items-center gap-2 flex-1 min-w-[160px]">
            <button type="button" data-action="toggle-eqitem-collapse" data-kind="armor" data-id="${ar.id}" data-tip="Rüstung ausklappen" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">▸</button>
            <span draggable="true" data-drag-eqitem="armor:${ar.id}" data-tip="Ziehen zum Sortieren" class="w-7 h-7 rounded bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>
            ${renderItemImgBox('armor',ar.id,ar.img,true)}

            <span class="pill cursor-default text-[11px] py-0.5 px-2">Schnitt ${esc(ar.protCut)} • Durchstoß ${esc(ar.protPierce)} • Einschlag ${esc(ar.protImpact)}</span>
            ${(ar.zones||[]).length?`<span class="pill cursor-default text-[11px] py-0.5 px-2">${esc(ar.zones.join(', '))}</span>`:''}
            ${renderEqColorAndMoveBtns('armor',ar,idx,len,'del-armor')}
          </div>
        </div>`;
      }
      return `<div data-eqitem="armor:${ar.id}" class="subcard space-y-2.5 border-emerald-500/30" ${winStyle}>
        <div class="flex flex-wrap items-center gap-2.5">
          <button type="button" data-action="toggle-eqitem-collapse" data-kind="armor" data-id="${ar.id}" data-tip="Rüstung einklappen" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">▾</button>
          <span draggable="true" data-drag-eqitem="armor:${ar.id}" data-tip="Ziehen zum Sortieren der Rüstung" class="w-7 h-7 rounded bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>
          ${renderItemImgBox('armor',ar.id,ar.img)}
          <div class="flex-1 min-w-[150px]">
            <label class="block text-[10px] font-bold t-mut">RÜSTUNGSNAME</label>
            <input data-arf="${ar.id}:name" type="text" value="${esc(ar.name)}" ${colStyle} placeholder="z.B. Kettenhemd, Plattenrüstung..." class="inp-line w-full text-sm sm:text-base font-extrabold"/>
          </div>
          <div class="grid grid-cols-4 gap-1.5 tabular">
            <div class="text-center"><label class="block text-[10px] font-extrabold text-emerald-400" data-tip="Generelle Rüstungspunkte (gRP)">gRP</label><input data-arf="${ar.id}:grp" type="text" value="${esc(ar.grp)}" placeholder="0" class="inp w-14 text-center font-black py-1 px-1 text-xs border-emerald-500/50"/></div>
            <div class="text-center"><label class="block text-[10px] font-bold t-mut" data-tip="Rüstung gegen Schnitt">Schnitt</label><input data-arf="${ar.id}:protCut" type="text" value="${esc(ar.protCut)}" placeholder="0" class="inp w-14 text-center font-black py-1 px-1 text-xs"/></div>
            <div class="text-center"><label class="block text-[10px] font-bold t-mut" data-tip="Rüstung gegen Durchstoß">Durchstoß</label><input data-arf="${ar.id}:protPierce" type="text" value="${esc(ar.protPierce)}" placeholder="0" class="inp w-14 text-center font-black py-1 px-1 text-xs"/></div>
            <div class="text-center"><label class="block text-[10px] font-bold t-mut" data-tip="Rüstung gegen Einschlag">Einschlag</label><input data-arf="${ar.id}:protImpact" type="text" value="${esc(ar.protImpact)}" placeholder="0" class="inp w-14 text-center font-black py-1 px-1 text-xs"/></div>

        <div class="pt-1 border-t bdr-line space-y-1.5 text-xs">
          <div class="flex items-center justify-between gap-2"><label class="block text-[11px] font-bold t-mut">Abgedeckte Trefferzonen</label><button type="button" data-action="toggle-ar-eq" data-id="${ar.id}" data-tip="Rüstung an-/ablegen (steuert aktive Rüstungs-Tags bei Proben)" class="btn py-0.5 px-2 text-[11px] ${ar.equipped!==false?'btn-ok':'opacity-65'}">${ar.equipped!==false?'✓ Rüstung angelegt':'○ Rüstung abgelegt'}</button></div>
          <div class="flex flex-wrap items-center gap-1.5">
            ${hzNames.map(zn=>{
              const on=(ar.zones||[]).includes(zn);
              return `<button type="button" data-action="toggle-ar-zone" data-id="${ar.id}" data-zone="${esc(zn)}" class="btn py-0.5 px-2 text-[11px] ${on?'btn-ok':'opacity-75'}">${on?'✓ ':''}${esc(zn)}</button>`;

              return `<span class="inline-flex items-center"><button type="button" data-action="toggle-ar-zone" data-id="${ar.id}" data-zone="${esc(zn)}" class="btn py-0.5 px-2 text-[11px] rounded-r-none ${on?'btn-ok':'opacity-75'}">${on?'✓ ':''}${esc(zn)}</button><button type="button" data-action="del-ar-zone" data-id="${ar.id}" data-zone="${esc(zn)}" data-tip="Eigene Zone „${esc(zn)}“ löschen" class="btn py-0.5 px-1.5 text-[10px] rounded-l-none border-l-0 hover:text-rose-400 opacity-75">✕</button></span>`;

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-2.5 items-start pt-1 border-t bdr-line">

            <label class="block text-[11px] font-bold t-mut mb-1">Notizen</label>

          </div>
        </div>
      </div>`;

    function renderEquipCategorySec(secKey,secIdx,totalSecs,hzNames,eqH){
      const meta=S.equipSecMeta?.[secKey]||{collapsed:false,color:'',bgColor:''};
      const colStyle=meta.color?`style="color:${esc(meta.color)}"`:'', winStyle=cardColorStyle(meta);
      const hdrCommon=(titleHtml,extraBtnsHtml,rightAddHtml)=>`<div class="flex flex-wrap items-center justify-between gap-2 ${meta.collapsed?'':'border-b bdr-line pb-2'}">
        <div class="flex flex-wrap items-center gap-1.5">
          <button type="button" data-action="toggle-eqsec-collapse" data-sec="${secKey}" data-tip="${meta.collapsed?'Kategorie ausklappen':'Kategorie einklappen'}" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">${meta.collapsed?'▸':'▾'}</button>
          <span draggable="true" data-drag-eqsec="${secKey}" data-tip="Ziehen zum Verschieben der gesamten Kategorie" class="w-7 h-7 rounded bg-acc-soft border bdr-acc text-acc text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>
          <h3 class="text-base font-extrabold" ${colStyle}>${titleHtml}</h3>
          <button type="button" data-action="open-eqsec-color" data-sec="${secKey}" data-cmode="text" data-tip="Textfarbe der Kategorie anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${meta.color?`style="border-color:${esc(meta.color)}"`:''}>🎨</button>
          <button type="button" data-action="open-eqsec-color" data-sec="${secKey}" data-cmode="bg" data-tip="Fensterfarbe der Kategorie anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${meta.bgColor?`style="border-color:${esc(meta.bgColor)};background:color-mix(in srgb,${esc(meta.bgColor)} 35%,var(--surf2))"`:''}>🪟</button>
          ${extraBtnsHtml}
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          ${rightAddHtml}
          <button type="button" data-action="move-eqsec" data-sec="${secKey}" data-dir="-1" ${secIdx===0?'disabled':''} data-tip="Kategorie nach oben verschieben" class="btn py-1 px-2 text-xs">▲</button>
          <button type="button" data-action="move-eqsec" data-sec="${secKey}" data-dir="1" ${secIdx===totalSecs-1?'disabled':''} data-tip="Kategorie nach unten verschieben" class="btn py-1 px-2 text-xs">▼</button>
        </div>
      </div>`;

      if(secKey==='weapons'){
        return `<section data-eqsec="weapons" class="card space-y-3" ${winStyle}>
          ${hdrCommon(`⚔️ Waffen (${S.weapons.length})`,`<button type="button" data-action="open-list" data-ltype="weaponTags" class="btn py-0.5 px-2 text-xs">⚙️ Waffeneigenschaften (${S.weaponTagList.length})</button>`,`<button type="button" data-action="add-weapon" data-wtype="melee" class="btn py-1 px-2.5 text-xs">+ Nahkampfwaffe</button><button type="button" data-action="add-weapon" data-wtype="ranged" class="btn py-1 px-2.5 text-xs">+ Fernkampfwaffe</button>`)}
          ${!meta.collapsed?(!S.weapons.length?`<div class="py-4 text-center text-xs t-mut">Noch keine Waffen eingetragen.</div>`:`<div class="space-y-3">${S.weapons.map((w,i)=>renderWeaponCard(w,i,S.weapons.length)).join('')}</div>`):''}
        </section>`;
      }
      if(secKey==='ammos'){
        return `<section data-eqsec="ammos" class="card space-y-3" ${winStyle}>
          ${hdrCommon(`<span class="${meta.color?'':'text-amber-400'}">🎯 Munition (${S.ammos.length})</span>`,`<button type="button" data-action="open-ammo-modal" data-wid="" class="btn py-0.5 px-2 text-xs">📋 Munitionsliste (${S.ammos.length})</button><button type="button" data-action="open-list" data-ltype="ammoTags" class="btn py-0.5 px-2 text-xs">⚙️ Munitions-Tags (${S.ammoTagList.length})</button>`,`<button type="button" data-action="add-ammo" class="btn border-amber-400/60 text-amber-400 py-1 px-2.5 text-xs">+ Munition hinzufügen</button>`)}
          ${!meta.collapsed?(!S.ammos.length?`<div class="py-3 text-center text-xs t-mut">Noch keine Munition erfasst.</div>`:`<div class="space-y-3">${S.ammos.map((am,i)=>renderAmmoCard(am,i,S.ammos.length)).join('')}</div>`):''}
        </section>`;
      }
      if(secKey==='armors'){
        return `<section data-eqsec="armors" class="card space-y-3" ${winStyle}>
          ${hdrCommon(`<span class="${meta.color?'':'text-emerald-400'}">🛡️ Rüstungen (${S.armors.length})</span>`,`<button type="button" data-action="open-list" data-ltype="armorTags" class="btn py-0.5 px-2 text-xs">⚙️ Rüstungs-Tags (${S.armorTagList.length})</button>`,`<button type="button" data-action="add-armor" class="btn border-emerald-400/60 text-emerald-400 py-1 px-2.5 text-xs">+ Rüstung hinzufügen</button>`)}
          ${!meta.collapsed?(!S.armors.length?`<div class="py-3 text-center text-xs t-mut">Noch keine Rüstungen eingetragen.</div>`:`<div class="space-y-3">${S.armors.map((ar,i)=>renderArmorCard(ar,i,S.armors.length,hzNames)).join('')}</div>`):''}
        </section>`;
      }
      return `<section data-eqsec="inventory" class="card space-y-3" ${winStyle}>
        ${hdrCommon(`🎒 Inventar (${S.inventory.length})`,'',`<button type="button" data-action="add-inv" class="btn btn-pri py-1 px-2.5 text-xs">+ Gegenstand</button>`)}
        ${!meta.collapsed?`<div class="overflow-x-auto"><table class="tbl min-w-[700px] text-sm"><thead><tr><th class="text-left w-16">⠿</th><th class="text-left w-14">Bild</th><th class="text-left">Gegenstand</th><th class="text-left w-36">Kategorie</th><th class="text-center w-20">Menge</th><th class="text-left">Notizen</th><th class="w-16"></th></tr></thead><tbody>${S.inventory.map((it,idx)=>`<tr data-eqitem="inv:${it.id}" ${it.bgColor?`style="background:color-mix(in srgb,${esc(it.bgColor)} 24%,transparent)"`:''}><td><div class="flex items-center gap-1"><span draggable="true" data-drag-eqitem="inv:${it.id}" class="px-1.5 py-0.5 rounded bg-black/20 border bdr-line t-mut text-xs font-black cursor-grab select-none">⠿</span>${S.inventory.length>1?`<span class="inline-flex flex-col leading-none"><button type="button" data-action="move-eqitem" data-kind="inv" data-id="${it.id}" data-dir="-1" ${idx===0?'disabled':''} class="text-[9px] t-mut hover:text-acc disabled:opacity-25">▲</button><button type="button" data-action="move-eqitem" data-kind="inv" data-id="${it.id}" data-dir="1" ${idx===S.inventory.length-1?'disabled':''} class="text-[9px] t-mut hover:text-acc disabled:opacity-25">▼</button></span>`:''}</div></td><td>${renderItemImgBox('inv',it.id,it.img)}</td><td><input data-inv="${it.id}:name" type="text" value="${esc(it.name)}" ${it.color?`style="color:${esc(it.color)}"`:''} placeholder="Gegenstand..." class="inp-line w-full font-bold"/></td><td><input data-inv="${it.id}:category" type="text" value="${esc(it.category)}" class="inp-line w-full text-xs"/></td><td class="text-center"><input data-inv="${it.id}:qty" type="text" value="${esc(it.qty)}" class="inp w-16 text-center py-0.5 text-xs font-bold"/></td><td><input data-inv="${it.id}:notes" type="text" value="${esc(it.notes)}" placeholder="Notizen" class="inp-line w-full text-xs"/></td><td class="text-right"><div class="inline-flex items-center gap-1"><button type="button" data-action="open-eq-color" data-kind="inv" data-id="${it.id}" data-cmode="text" class="btn w-6 h-6 p-0 text-[10px]">🎨</button><button type="button" data-action="open-eq-color" data-kind="inv" data-id="${it.id}" data-cmode="bg" class="btn w-6 h-6 p-0 text-[10px]">🪟</button><button type="button" data-action="del-inv" data-id="${it.id}" class="t-mut hover:text-rose-500 font-bold px-1">✕</button></div></td></tr>`).join('')}</tbody></table></div>
        <div class="pt-2 border-t bdr-line">
          <div class="flex items-center justify-between mb-1"><label class="block text-xs font-extrabold t-mut">Waffen, Rüstung &amp; Handwerk (Freitext)</label><span class="text-[10px] t-mut" data-tip="Markierten Text formatieren: Strg+B = Fett, Strg+I = Kursiv, Strg+U = Unterstrichen">Shortcuts: <b>B</b>/<i>I</i>/<u>U</u></span></div>
          <div contenteditable="true" data-bind-rtf="equipNotes" data-boxh="bio:equipNotes" ${eqH} data-ph="Notizen" class="inp w-full autogrow rtf-box">${toRtfHtml(S.equipNotes)}</div>
        </div>`:''}
      </section>`;
    }

    function tplEquipment(){
      const hzNames=[...new Set(S.hitZones.map(z=>String(z.zone||'').trim()).filter(Boolean))];
      const eqH=S.bioBoxH?.equipNotes>0?`style="height:${S.bioBoxH.equipNotes}px"`:'';
      const ord=Array.isArray(S.equipSecOrder)&&S.equipSecOrder.length===4?S.equipSecOrder:DEF_EQ_SEC_ORDER;
      return `<section class="card flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-base sm:text-lg font-extrabold" data-tip="Kategorien und einzelne Gegenstände lassen sich über ⠿ per Drag &amp; Drop oder ▲/▼ verschieben, über ▾/▸ ein- und ausklappen sowie über 🎨/🪟 einfärben.">Ausrüstung – Waffen, Munition, Rüstungen &amp; Inventar</h2>
          <p class="text-xs t-mut">Kategorien &amp; Einträge sind frei sortierbar (⠿ / ▲▼), klappbar (▾/▸) und einfärbbar (🎨 Text / 🪟 Fenster).</p>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <button type="button" data-action="collapse-all-eq" data-val="1" class="btn py-1 px-2.5 text-xs">▸ Alle einklappen</button>
          <button type="button" data-action="collapse-all-eq" data-val="0" class="btn py-1 px-2.5 text-xs">▾ Alle ausklappen</button>
          <button type="button" data-action="add-weapon" data-wtype="melee" class="btn btn-pri">⚔️ + Nahkampf</button>
          <button type="button" data-action="add-weapon" data-wtype="ranged" class="btn bg-acc-soft bdr-acc text-acc">🏹 + Fernkampf</button>
          <button type="button" data-action="add-ammo" class="btn border-amber-400/60 text-amber-400">🎯 + Munition</button>
          <button type="button" data-action="add-armor" class="btn border-emerald-400/60 text-emerald-400">🛡️ + Rüstung</button>
          <button type="button" data-action="add-inv" class="btn">🎒 + Inventar</button>
        </div>
      </section>

      <div class="space-y-5">
        ${ord.map((secKey,sIdx)=>renderEquipCategorySec(secKey,sIdx,ord.length,hzNames,eqH)).join('')}
      </div>

      <section class="card space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b bdr-line pb-2">
          <h2 class="text-base font-extrabold">Bio &amp; Beschreibung</h2>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] t-mut mr-1">Formatierung (oder Strg+B/I/U):</span>
            <button type="button" data-action="rtf-cmd" data-cmd="bold" class="btn py-0.5 px-2 text-xs font-black">B</button>
            <button type="button" data-action="rtf-cmd" data-cmd="italic" class="btn py-0.5 px-2 text-xs italic font-serif">I</button>
            <button type="button" data-action="rtf-cmd" data-cmd="underline" class="btn py-0.5 px-2 text-xs underline">U</button>
          </div>
        </div>
        <div class="space-y-4">${BIO_FIELDS.map(b=>{
          const bh=S.bioBoxH?.[b.k]>0?`style="height:${S.bioBoxH[b.k]}px"`:'';
          const isAus=b.k==='aussehen';
          return `<div class="space-y-2">

    function autoSizeAllTextareas(){
      document.querySelectorAll('.autogrow').forEach(ta=>{
        const parts=(ta.dataset.boxh||'').split(':');
        let saved=0;
        if(parts[0]==='bio') saved=toInt(S.bioBoxH?.[parts[1]],0);
        else{const it=findPwItem(parts[0],parts[1]);saved=it?.boxH?.[parts[2]]||0;}
        if(saved>0) ta.style.height=saved+'px';
        else ta.style.height=Math.max(58,ta.scrollHeight)+'px';
      });
    }
    function tplLobbyScreen(){
      const P=calcProg(), myId=CLOUD.viewingRemote?(JSON.parse(CLOUD.ownBackupJson||'{}').charId||''):S.charId;
      const baseOrig=window.location.origin&&window.location.origin!=='null'?`${window.location.origin}${window.location.pathname}`:'';
      const shareUrl=baseOrig?`${baseOrig}?char=${encodeURIComponent(S.charId||'')}`:'';
      const lobbyUrl=baseOrig?`${baseOrig}?lobby=1`:'?lobby=1';
      const regUsers=Object.keys(CLOUD.registry.users||{}).sort((a,b)=>a.localeCompare(b,'de'));
      const allCampaigns=getCampaigns();
      const knownUsers=sortAlpha([
        ...regUsers,
        ...Object.values(CLOUD.registry.claims||{}),
        ...allCampaigns.flatMap(c=>c.allowedUsers||[]),
        ...(CLOUD.currentUser?[CLOUD.currentUser]:[])
      ]);
      const visibleCampaigns=getAccessibleCampaigns(CLOUD.currentUser);
      if(!visibleCampaigns.some(c=>c.id===CLOUD.activeCampaignId)&&visibleCampaigns.length){
        setActiveCampaign(visibleCampaigns[0].id);
      }
      const activeCamp=visibleCampaigns.find(c=>c.id===CLOUD.activeCampaignId)||visibleCampaigns[0]||allCampaigns[0]||{id:'default',name:'Ohne Kampagne / Allgemein',allowedUsers:[]};
      const activeCampId=activeCamp?activeCamp.id:'default';
      const campAllowedUsers=Array.isArray(activeCamp?.allowedUsers)?activeCamp.allowedUsers:[];
      const availCampUsers=knownUsers.filter(u=>!campAllowedUsers.some(au=>au.toLowerCase()===u.toLowerCase()));
      const campGmUsers=Array.isArray(activeCamp?.gmUsers)?activeCamp.gmUsers:[];
      const campCoGmUsers=Array.isArray(activeCamp?.coGmUsers)?activeCamp.coGmUsers:[];
      const availCampGMs=knownUsers.filter(u=>!campGmUsers.some(g=>g.toLowerCase()===u.toLowerCase()));
      const availCampCoGMs=sortAlpha(CLOUD.registry.gmUsers||[]).filter(u=>!campGmUsers.some(g=>g.toLowerCase()===u.toLowerCase())&&!campCoGmUsers.some(cg=>cg.toLowerCase()===u.toLowerCase()));
      const campCharList=CLOUD.list.filter(ch=>getCharCampaignId(ch.id)===activeCampId);
      const myTotalCnt=CLOUD.currentUser?CLOUD.list.filter(ch=>getCharOwner(ch.id).toLowerCase()===CLOUD.currentUser.toLowerCase()).length:0;
      const myCampCnt=CLOUD.currentUser?campCharList.filter(ch=>getCharOwner(ch.id).toLowerCase()===CLOUD.currentUser.toLowerCase()).length:0;
      const visibleList=CLOUD.filterMine&&CLOUD.currentUser?campCharList.filter(ch=>getCharOwner(ch.id).toLowerCase()===CLOUD.currentUser.toLowerCase()||(UI.sheetLoaded&&ch.id===myId)):campCharList;
      const creatableCamps=getCreatableCampaigns(CLOUD.currentUser);
      const hasSpecificCamp=creatableCamps.some(c=>c.id!=='default');
      const selNewCampId=creatableCamps.some(c=>c.id===CLOUD.newCharCampId)?CLOUD.newCharCampId:(creatableCamps.some(c=>c.id===activeCampId)?activeCampId:'default');
      const myCurOwner=getCharOwner(S.charId)||S.owner||'';
      const myCurCampObj=allCampaigns.find(c=>c.id===getCharCampaignId(S.charId))||allCampaigns[0];

      return `<div class="space-y-6">
        <!-- Sektion 1: Account- & Willkommens-Zentrale -->

              </div>

                <button type="button" data-action="admin-logout" class="btn btn-err py-0.5 px-2.5 text-[11px]">🔒 Admin sperren</button>

    function renderMain(){
      if(UI.inLobby){
        const prevCampTabsEl=$('mainMount')?.querySelector('[data-lobby-camp-tabs]');
        const prevCampLeft=prevCampTabsEl?prevCampTabsEl.scrollLeft:null;
        $('mainMount').innerHTML=tplLobbyScreen();
        if(prevCampLeft!==null){
          const newCampTabsEl=$('mainMount')?.querySelector('[data-lobby-camp-tabs]');
          if(newCampTabsEl) newCampTabsEl.scrollLeft=prevCampLeft;
        }
        return;
      }
      $('mainMount').innerHTML=S.activeTab==='attributes'?tplAttributes():S.activeTab==='skills'?tplSkills():S.activeTab==='powers'?tplPowers():S.activeTab==='chronicle'?tplChronicle():tplEquipment();
      if(S.activeTab==='powers'||S.activeTab==='equipment') autoSizeAllTextareas();
    }

    function buildAdvDisInnerHtml(T){
      const aSrc=(T.advSrc||[]).filter(s=>s.kind!=='dis'), dSrc=(T.advSrc||[]).filter(s=>s.kind==='dis');
      const aTip=aSrc.length?`data-tip="${esc('Aktive Vorteils-Quellen:\n'+fmtAdvSrcLines(aSrc))}"`:'';
      const dTip=dSrc.length?`data-tip="${esc('Aktive Nachteils-Quellen:\n'+fmtAdvSrcLines(dSrc))}"`:'';
      const netBonus=T.bonus-T.effTh;
      const fmtSrcChip=s=>{
        const absV=Math.abs(s.val), unit=s.kind==='dis'?(absV===1?'Nachteil':'Nachteile'):(absV===1?'Vorteil':'Vorteile');
        const orig=formatSrcOriginLabel(s);
        const cls=s.val<0?'bg-emerald-500/15 text-emerald-300 border-emerald-500/35':s.kind==='dis'?'bg-rose-500/15 text-rose-300 border-rose-500/35':'bg-emerald-500/15 text-emerald-300 border-emerald-500/35';
        const tip=esc(`${s.srcName} (${s.srcKind}): ${fmtSign(s.val)} ${unit} [${s.label}]`);
        return `<span data-tip="${tip}" class="px-1.5 py-0.5 rounded border text-[10px] font-bold tabular cursor-help ${cls}">${fmtSign(s.val)} ${unit} (${esc(orig)})</span>`;
      };
      return `<div class="grid grid-cols-11 gap-1.5 items-center">

    function getCaretRangeAtPoint(x,y){
      if(typeof document.caretRangeFromPoint==='function') return document.caretRangeFromPoint(x,y);
      if(typeof document.caretPositionFromPoint==='function'){
        const pos=document.caretPositionFromPoint(x,y);
        if(pos&&pos.offsetNode){
          const r=document.createRange();
          r.setStart(pos.offsetNode,pos.offset);
          r.collapse(true);
          return r;
        }
      }
      return null;
    }

    function saveEffRangeIfActive(){
      const sel=window.getSelection();
      if(!sel||!sel.rangeCount) return;
      const rng=sel.getRangeAt(0);
      const node=rng.commonAncestorContainer;
      const effEl=node?.nodeType===1?node.closest?.('[id^="eff_"]'):node?.parentElement?.closest?.('[id^="eff_"]');
      if(effEl&&effEl.id?.startsWith('eff_')){
        savedEffRanges[effEl.id.slice(4)]=rng.cloneRange();
      }
    }

    function insertTokenAtCursor(kind,id,tok,dropPoint=null){
      const it=findPwItem(kind,id); if(!it) return;
      const effEl=$(`eff_${id}`);
      let targetRange=null;
      if(effEl){
        if(dropPoint&&typeof dropPoint.x==='number'&&typeof dropPoint.y==='number'){
          const dr=getCaretRangeAtPoint(dropPoint.x,dropPoint.y);
          if(dr&&effEl.contains(dr.startContainer)) targetRange=dr;
        }
        if(!targetRange){
          const sel=window.getSelection();
          if(sel&&sel.rangeCount){
            const sr=sel.getRangeAt(0);
            if(effEl.contains(sr.commonAncestorContainer)) targetRange=sr.cloneRange();
          }
        }
        if(!targetRange&&savedEffRanges[id]){
          const vr=savedEffRanges[id];
          if(vr.startContainer&&vr.startContainer.isConnected&&effEl.contains(vr.startContainer)) targetRange=vr.cloneRange();
        }
      }
      if(effEl&&targetRange){
        effEl.focus();
        let pre='', post='';
        if(targetRange.startContainer.nodeType===3){
          const txt=targetRange.startContainer.nodeValue||'';
          const chBefore=targetRange.startOffset>0?txt[targetRange.startOffset-1]:'';
          const chAfter=targetRange.startOffset<txt.length?txt[targetRange.startOffset]:'';
          if(chBefore&&!/[\s(\[]/.test(chBefore)) pre=' ';
          if(chAfter&&!/[\s.,;:!?)\]]/.test(chAfter)) post=' ';
        }
        targetRange.deleteContents();
        const tNode=document.createTextNode(pre+tok+post);
        targetRange.insertNode(tNode);
        const nr=document.createRange();
        nr.setStartAfter(tNode); nr.collapse(true);
        const sel=window.getSelection();
        if(sel){sel.removeAllRanges();sel.addRange(nr);}
        savedEffRanges[id]=nr.cloneRange();
        withPoolSync(()=>{
          it.applyMods=true;
          it.effects=effEl.innerHTML;
        });
        const tb=$(`tokBar_${id}`); if(tb) tb.innerHTML=buildTokBarInnerHtml(kind,it);
        autoSizeAllTextareas();
        syncLiveCalculations();
        renderHeader();
        save();
        toast(`Baustein ${tok} an Cursorposition eingefügt!`);
        return;
      }
      withPoolSync(()=>{
        it.applyMods=true;
        const cur=String(it.effects||'').trim();
        it.effects=cur?`${cur} ${esc(tok)}`:esc(tok);
      });
      renderMain(); renderHeader(); save(); toast(`Baustein ${tok} eingefügt & auf Bogen aktiv!`);
    }

    function spendResource(kind,id){
      const it=findPwItem(kind,id); if(!it) return;
      const amt=toInt(it.useAmt,0), r=it.useRes, hasCost=Boolean(r&&amt>0);
      const stToks=parseStatusTokens(it.effects);
      if(!hasCost&&!stToks.length) return;
      const nm=it.name||(kind==='augment'?'Augment':'Kraft');
      let costMsg='', logParts=[];
      if(hasCost){
        if(r==='ap') S.secondary.apCurrent=toInt(S.secondary.apCurrent)-amt;
        else if(r==='map') S.secondary.mapCurrent=toInt(S.secondary.mapCurrent)-amt;
        else if(r==='lp') S.secondary.lpCurrent=toInt(S.secondary.lpCurrent)-amt;
        else if(r==='mlp') S.secondary.mlpCurrent=toInt(S.secondary.mlpCurrent)-amt;
        else if(r==='cres') S.customRes.current=toInt(S.customRes.current)-amt;
        else if(r==='bst') S.bst=toInt(S.bst)-amt;
        else if(String(r).startsWith('ex_')){const ex=(S.extraSecList||[]).find(x=>'ex_'+x.id===r);if(ex)ex.current=toInt(ex.current)-amt;}
        const exMatch=String(r).startsWith('ex_')?(S.extraSecList||[]).find(x=>'ex_'+x.id===r):null;
        const curVal=exMatch?exMatch.current:{ap:S.secondary.apCurrent,map:S.secondary.mapCurrent,lp:S.secondary.lpCurrent,mlp:S.secondary.mlpCurrent,cres:S.customRes.current,bst:S.bst}[r];
        costMsg=`−${amt} ${getResLabel(r)}${curVal!==undefined?` (jetzt: ${curVal})`:''}`;
        logParts.push(`−${amt} ${getResLabel(r)}${curVal!==undefined?` (verbleibend: ${curVal})`:''}`);
      }
      const actNames=[];
      if(stToks.length){
        withPoolSync(()=>{
          stToks.forEach(tk=>{
            const def=STATUS_DEFS.find(d=>d.k===tk.statusKey);
            if(!def) return;
            if(!S.statusEffects[def.k]) S.statusEffects[def.k]={active:false,stacks:1,iniDir:def.k==='abgelenkt'?-1:1,statOvr:'',advOvr:''};
            S.statusEffects[def.k].active=true;
            S.statusEffects[def.k].stacks=Math.max(1,toInt(tk.stacks,1));
            if(def.hasIniChoice){
              UI.statusIniPromptKey=def.k;
              S.statusCollapsed=false;
            }
            actNames.push(`${def.name}${tk.stacks>1?` (${tk.stacks}×)`:''}`);
          });
        });
        if(actNames.length) logParts.push(`Status aktiviert: ${actNames.join(', ')}`);
      }
      logChron(`Einsatz "${nm}": ${logParts.join(' • ')}.`);
      syncDiceFromSheet(); renderHeader(); renderMain(); renderDice(); save();
      toast(`⚡ ${nm}: ${[costMsg,actNames.length?`Status ${actNames.join(', ')} aktiv!`:''].filter(Boolean).join(' • ')}`);
    }

      return Math.floor(Math.random()*100)+1;
    }

    function compressImg(file,maxDim,q,cb){
      const rd=new FileReader();
      rd.onload=ev=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);let out=cv.toDataURL('image/webp',q);if(!out.startsWith('data:image/webp'))out=cv.toDataURL('image/jpeg',q);cb(out);};im.src=ev.target.result;};
      rd.readAsDataURL(file);
    }

      const sId=secId&&S.skillSections.some(s=>s.id===secId)?secId:'';

        function compressImgFile(file,maxSide,cb){
      if(!file) return;
      const r=new FileReader();
      r.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          const scale=Math.min(1,maxSide/Math.max(img.width||1,img.height||1));
          const w=Math.max(1,Math.round((img.width||1)*scale)), h=Math.max(1,Math.round((img.height||1)*scale));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
          let dataUrl=cv.toDataURL('image/webp',0.82);
          if(!dataUrl||dataUrl.indexOf('data:image/webp')!==0) dataUrl=cv.toDataURL('image/jpeg',0.82);
          cb(dataUrl);
        };
        img.onerror=()=>cb(String(ev.target.result||''));
        img.src=String(ev.target.result||'');
      };
      r.readAsDataURL(file);
    }

          if(tag==='OL') return `<ol>${inner.replace(/^(?:<br\s*\/?>|\s)+|(?:<br\s*\/?>|\s)+$/gi,'')}</ol>`;

      if(e.key==='Enter'&&e.target.id==='inpCampaignName'){
        e.preventDefault();
        const btn=document.querySelector('[data-action="camp-new-save"],[data-action="camp-rename-save"]');
        if(btn) btn.click();
        return;
      }
      if(e.key==='Enter'&&e.target.id==='inpCampAddUser'){
        e.preventDefault();
        addCampaignAllowedUser(e.target.value);
        return;
      }
      if(e.key==='Enter'&&e.target.dataset?.arf?.endsWith(':customZones')){
        e.preventDefault();
        const arId=e.target.dataset.arf.split(':')[0], ar=S.armors.find(a=>a.id===arId);
        if(ar){
          const parts=String(e.target.value||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
          if(parts.length){
            if(!Array.isArray(ar.extraZones)) ar.extraZones=[];
            if(!Array.isArray(ar.zones)) ar.zones=[];
            const hzNames=S.hitZones.map(z=>String(z.zone||'').trim()).filter(Boolean);
            parts.forEach(p=>{
              if(!hzNames.includes(p)&&!ar.extraZones.includes(p)) ar.extraZones.push(p);
              if(!ar.zones.includes(p)) ar.zones.push(p);
            });
            ar.customZones='';
            renderMain(); save();
          }
        }
        return;
      }
      if(e.key==='Escape'){if(UI.modal){UI.modal=null;applyTheme();renderModal();}else if(D.open&&!D.docked){D.open=false;renderHeader();renderDice();}else if(CN.open&&!CN.docked){CN.open=false;renderHeader();renderCampNotes();}}
    });
    window.addEventListener('resize',()=>{if(D.open)renderDice();if(CN.open)renderCampNotes();if(LD.open)renderLiveDice();});

    load();
    initLiveDiceChannel();
    const params=new URLSearchParams(window.location.search);
    const reqCharId=(params.get('char')||'').trim();
    const forceSheet=params.get('sheet')==='1';
    const forceLobby=params.get('lobby')==='1';
    if(reqCharId){
      UI.inLobby=false; UI.sheetLoaded=true; UI.modal=null;
      renderAll(false);
      loadCloudCharacter(reqCharId,false,true);
      fetchLobbyList(true);
    }else if(forceSheet&&!forceLobby){
      UI.inLobby=false; UI.sheetLoaded=true; UI.modal=null;
      renderAll(false);
      fetchLobbyList(true);
    }else{
      UI.inLobby=true; UI.sheetLoaded=false; UI.modal=null;
      renderAll(false);
      fetchLobbyList(true);
    }
  })();
  </script>
</body>
</html>
