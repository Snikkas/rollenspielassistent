    function handleIncomingDicePayload(rawObj,isRealtimePush=false){
      if(!rawObj||typeof rawObj!=='object') return;
      if(rawObj.type==='clear_dice'){
        if(rawObj.campaignId){
          CLOUD.diceFeed=(CLOUD.diceFeed||[]).filter(e=>getRollCampaignId(e)!==rawObj.campaignId);
          CLOUD.registry.diceFeed=(CLOUD.registry.diceFeed||[]).filter(e=>getRollCampaignId(e)!==rawObj.campaignId);
        }else{
          const clr=toInt(rawObj.clearedAt,Date.now());
          CLOUD.registry.diceClearedAt=Math.max(toInt(CLOUD.registry.diceClearedAt,0),clr);
          CLOUD.diceFeed=[];
          CLOUD.registry.diceFeed=[];
        }
        saveDiceFeedLocal(); saveRegistryLocal();
        updateLobbyLiveDiceDOM();
        return;
      }
      if(!rawObj.id||!Array.isArray(rawObj.res)) return;
      if(toInt(rawObj.tsMs,0)<=toInt(CLOUD.registry.diceClearedAt,0)) return;
      const already=(CLOUD.diceFeed||[]).some(x=>x.id===rawObj.id);
      if(already) return;
      mergeDiceFeeds([rawObj]);
      updateLobbyLiveDiceDOM();
      if(isRealtimePush&&rawObj.senderTabId!==LIVE_TAB_ID&&CLOUD.diceToast&&getRollCampaignId(rawObj)===getActiveLiveCampaignId()){
        const r0=rawObj.res[0];
        const sumTxt=rawObj.isHz?`W100 = ${r0?.r} (${rawObj.hzZone||'Zone'})`:rawObj.res.length===1
          ?`${r0.r} (${r0.crit?'★ KRIT! ':''}${r0.ok?'EG '+r0.eg:'MEG '+r0.meg})`
          :`${rawObj.res.filter(x=>x.ok).length}/${rawObj.res.length} Erfolge`;
        toast(`🎲 Live-Wurf (${rawObj.charName||'Spieler'}): ${rawObj.label||'Probe'} → ${sumTxt}`);
      }
    }
    function initLiveDiceChannel(){
      try{
        if(!liveDiceBC&&typeof BroadcastChannel!=='undefined'){

        }
      }catch(e){}
      try{
        const topic=getLiveDiceTopic();
        if(liveDiceES&&liveDiceTopicCur===topic) return;
        if(liveDiceES){try{liveDiceES.close();}catch(e){} liveDiceES=null;}
        liveDiceTopicCur=topic;
        if(typeof EventSource!=='undefined'){
          liveDiceES=new EventSource(`https://ntfy.sh/${encodeURIComponent(topic)}/sse`);
          liveDiceES.onopen=()=>{CLOUD.diceConnected=true;updateLobbyLiveDiceDOM();};
          liveDiceES.onerror=()=>{CLOUD.diceConnected=false;updateLobbyLiveDiceDOM();};
          liveDiceES.onmessage=ev=>{
            if(!ev?.data) return;
            try{
              const outer=JSON.parse(ev.data);
              if(outer&&outer.event==='message'&&typeof outer.message==='string'){
                handleIncomingDicePayload(JSON.parse(outer.message),true);
              }else if(outer&&outer.id&&Array.isArray(outer.res)){
                handleIncomingDicePayload(outer,true);
              }
            }catch(err){}
          };
        }
      }catch(e){}
      if(!liveDicePollTimer){
        liveDicePollTimer=setInterval(()=>{
          if((UI.modal==='lobby'||UI.inLobby) || LD.open) syncCloudRegistry(false);
        },4000);
      }

    async function syncCloudRegistry(push=false){
      if(!push&&(registryPushInFlight>0||(Date.now()-lastRegistryPushMs<2500))) return;
      if(push){
        registryPushInFlight++;
        CLOUD.registryLoaded=true;
      }
      const localSnap=push?JSON.parse(JSON.stringify({
        users:CLOUD.registry.users||{},
        claims:CLOUD.registry.claims||{},
        pins:CLOUD.registry.pins||{},
        charCampaigns:CLOUD.registry.charCampaigns||{},
        campaigns:normalizeCampaigns(CLOUD.registry.campaigns),
        gmUsers:Array.isArray(CLOUD.registry.gmUsers)?[...new Set(CLOUD.registry.gmUsers.map(u=>String(u||'').trim()).filter(Boolean))]:[],
        lobbyLogo:String(CLOUD.registry.lobbyLogo??''),
        adminHash:CLOUD.registry.adminHash??'',
        diceClearedAt:toInt(CLOUD.registry.diceClearedAt,0)
      })):null;
      try{
        const getRes=await fetch(`${getCloudEndpoint()}?id=${encodeURIComponent(REGISTRY_ID)}`,{headers:{'Accept':'application/json'}});
        if(getRes.ok){
          const rem=await getRes.json();
          if(rem&&typeof rem==='object'&&rem.registry){
            if(!push&&(registryPushInFlight>0||(Date.now()-lastRegistryPushMs<2500))) return;
            const clrAt=Math.max(toInt(rem.registry.diceClearedAt,0),toInt(localSnap?localSnap.diceClearedAt:CLOUD.registry.diceClearedAt,0));
            const mergedClaims={...(rem.registry.claims||{})};
            const srcClaims=localSnap?localSnap.claims:(CLOUD.registry.claims||{});
            Object.entries(srcClaims).forEach(([k,v])=>{mergedClaims[k]=v??'';});
            if(!push){
              Object.entries(rem.registry.claims||{}).forEach(([k,v])=>{mergedClaims[k]=v??'';});
            }
            const mergedCharCampaigns={...(rem.registry.charCampaigns||{})};
            const srcCharCamps=localSnap?localSnap.charCampaigns:(CLOUD.registry.charCampaigns||{});
            Object.entries(srcCharCamps).forEach(([k,v])=>{mergedCharCampaigns[k]=String(v||'default').trim()||'default';});
            if(!push){
              Object.entries(rem.registry.charCampaigns||{}).forEach(([k,v])=>{mergedCharCampaigns[k]=String(v||'default').trim()||'default';});
            }
            const remHasCamps=Array.isArray(rem.registry.campaigns)&&rem.registry.campaigns.length>0;
            const mergedCampaigns=push
              ?normalizeCampaigns(localSnap.campaigns)
              :(remHasCamps?normalizeCampaigns(rem.registry.campaigns):normalizeCampaigns(CLOUD.registry.campaigns));
            const validCampIds=new Set(mergedCampaigns.map(c=>c.id));
            Object.keys(mergedCharCampaigns).forEach(cid=>{
              if(!validCampIds.has(mergedCharCampaigns[cid])) mergedCharCampaigns[cid]='default';
            });
            const srcUsers=localSnap?localSnap.users:(CLOUD.registry.users||{});
            const srcPins=localSnap?localSnap.pins:(CLOUD.registry.pins||{});
            CLOUD.registry={
              users:push?{...(rem.registry.users||{}),...srcUsers}:{...srcUsers,...(rem.registry.users||{})},
              claims:mergedClaims,
              pins:push?{...(rem.registry.pins||{}),...srcPins}:{...srcPins,...(rem.registry.pins||{})},
              charCampaigns:mergedCharCampaigns,
              campaigns:mergedCampaigns,
              gmUsers: push ? (localSnap.gmUsers||[]) : (Array.isArray(rem.registry.gmUsers)?rem.registry.gmUsers:(CLOUD.registry.gmUsers||[])),
              lobbyLogo: push ? (localSnap.lobbyLogo??'') : (rem.registry.lobbyLogo!==undefined?String(rem.registry.lobbyLogo):(CLOUD.registry.lobbyLogo||'')),
              adminHash:push?(localSnap.adminHash!==''?localSnap.adminHash:(rem.registry.adminHash||'')):(rem.registry.adminHash||CLOUD.registry.adminHash||''),
              diceClearedAt:clrAt,
              diceFeed:CLOUD.diceFeed||[]
            };
            CLOUD.list.forEach(ch=>{
              if(ch&&ch.id){
                const cid=mergedCharCampaigns[ch.id]||ch.campaignId||'default';
                ch.campaignId=validCampIds.has(cid)?cid:'default';
                CLOUD.registry.charCampaigns[ch.id]=ch.campaignId;
              }
            });
            CLOUD.registryLoaded=true;
            mergeDiceFeeds(rem.registry.diceFeed||[],clrAt);
            saveRegistryLocal();
            updateLobbyLiveDiceDOM();
          }
        }
        if(push){
          CLOUD.registry.campaigns=normalizeCampaigns(localSnap?localSnap.campaigns:CLOUD.registry.campaigns);
          const payload={charId:REGISTRY_ID,profile:{name:'__REGISTRY__'},registry:CLOUD.registry,_summary:{updatedAt:stamp()}};
          await fetch(getCloudEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          lastRegistryPushMs=Date.now();
          saveRegistryLocal();
        }
      }catch(e){saveRegistryLocal();}
      finally{

          registryPushInFlight=Math.max(0,registryPushInFlight-1);
          lastRegistryPushMs=Date.now();
        }
      }
    }
    function addCampaignAllowedUser(rawName){

      const camps=getCampaigns();
      const camp=camps.find(c=>c.id===CLOUD.activeCampaignId);
      if(!camp) return;
      if(!Array.isArray(camp.allowedUsers)) camp.allowedUsers=[];
      const known=sortAlpha([
        ...Object.keys(CLOUD.registry.users||{}),
        ...Object.values(CLOUD.registry.claims||{}),
        ...camps.flatMap(c=>c.allowedUsers||[]),
        ...(CLOUD.currentUser?[CLOUD.currentUser]:[])
      ]);
      const canonical=known.find(u=>u.toLowerCase()===clean.toLowerCase())||clean;
      if(camp.allowedUsers.some(u=>u.toLowerCase()===canonical.toLowerCase())){
        toast(`ℹ️ „${canonical}“ ist dieser Kampagne bereits zugeordnet.`);
        return;
      }
      camp.allowedUsers.push(canonical);
      CLOUD.registry.campaigns=normalizeCampaigns(camps);
      saveRegistryLocal();
      renderModal();
      syncCloudRegistry(true);
      toast(`👤 „${canonical}“ zu „${camp.name}“ zugeordnet!`);

      else CLOUD.error='';

        await syncCloudRegistry(false);
        const res=await fetch(getCloudEndpoint(),{headers:{'Accept':'application/json'}});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data=await res.json();
        const validCampIds=new Set(getCampaigns().map(c=>c.id));

      <div class="overflow-x-auto"><table class="tbl min-w-[480px] text-sm tabular"><thead><tr><th class="text-left w-24">Wurf</th><th class="text-left">Zone</th><th class="text-left w-24">Größe</th><th class="text-right w-44">Rüstung / Notiz</th><th class="w-6"></th></tr></thead><tbody>${S.hitZones.map(z=>{const m=String(z.range||'').match(/\d+/g),hit=S.lastHzRoll!==null&&m&&S.lastHzRoll>=Math.min(+m[0],+(m[1]??m[0]))&&S.lastHzRoll<=Math.max(+m[0],+(m[1]??m[0]));return `<tr class="${hit?'bg-amber-500/20 font-bold':''}"><td><input data-hz="${z.id}:range" type="text" value="${esc(z.range)}" class="inp-line w-20 font-bold text-xs"/></td><td><div class="flex items-center gap-1">${hit?'<span>🎯</span>':''}<input data-hz="${z.id}:zone" type="text" value="${esc(z.zone)}" class="inp-line w-full font-bold"/></div></td><td><input data-hz="${z.id}:size" type="text" value="${esc(z.size)}" class="inp-line w-20 text-xs t-mut"/></td><td class="text-right"><input data-hz="${z.id}:armor" type="text" value="${esc(z.armor)}" placeholder="Notiz" class="inp w-full text-right text-xs py-1"/></td><td class="text-right">${S.hitZones.length>1?`<button type="button" data-action="del-hz" data-id="${z.id}" class="t-mut hover:text-rose-500 text-xs font-bold">✕</button>`:''}</td></tr>`;}).join('')}</tbody></table></div></div>
      <div class="lg:col-span-5 card flex flex-col"><div class="flex items-center justify-between mb-2.5"><h3 class="text-sm sm:text-base font-extrabold">Schnellzugriff</h3><span class="text-[10px] t-mut" data-tip="Markierten Text formatieren:\nStrg+B = Fett\nStrg+I = Kursiv\nStrg+U = Unterstrichen">Shortcuts: <b>B</b> / <i>I</i> / <u>U</u></span></div><div class="flex flex-wrap gap-1.5 mb-3">${QTABS.map(q=>`<button type="button" data-action="switch-qtab" data-qtab="${q.k}" class="btn text-xs py-1 px-2.5 ${S.quickTab===q.k?'btn-pri':''}">${q.l}</button>`).join('')}</div>${QTABS.filter(q=>q.k===S.quickTab).map(q=>`<div contenteditable="true" data-qnote="${q.k}" data-ph="${esc(q.ph)}" class="inp w-full flex-1 resize-y text-xs sm:text-sm rtf-box min-h-[140px]">${toRtfHtml(S.combatNotes[q.k])}</div>`).join('')}</div></section>`;
    }

    const skAttrOpts=sel=>ATTRS.map(a=>`<option value="${a.k}" ${a.k===sel?'selected':''}>${a.k} (${getAttrTot(a.k)})</option>`).join('');
    const skCatOpts=sel=>Object.entries(SK_CATS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v.l}</option>`).join('');

    function renderSkillRows(isChron, listOverride=null){
      const arr=listOverride||S.skills;
      if(!arr.length) return isChron?`<tr><td colspan="9" class="text-center text-xs t-mut py-3">Noch keine Fertigkeiten erworben.</td></tr>`:'';
      return arr.map((sk,idx)=>{
        const c=calcSkCost(sk), autoB=getSkAutoBonus(sk.rank), hasOvr=hasSkBonusOvr(sk), effB=getSkBonus(sk), av=getAttrTot(sk.linkedAttr), pool=av+effB;
        const dragBtn=`<span draggable="true" data-drag-sk="${sk.id}" data-tip="Ziehen zum Sortieren oder Verschieben in eine Sektion" class="px-1.5 py-0.5 rounded bg-black/20 border bdr-line t-mut text-xs font-black cursor-grab select-none shrink-0">⠿</span>`;
        const moveBtns=arr.length>1?`<span class="inline-flex flex-col leading-none shrink-0"><button type="button" data-action="move-sk" data-id="${sk.id}" data-dir="-1" data-chron="${isChron?'1':'0'}" ${idx===0?'disabled':''} class="text-[9px] t-mut hover:text-acc disabled:opacity-25">▲</button><button type="button" data-action="move-sk" data-id="${sk.id}" data-dir="1" data-chron="${isChron?'1':'0'}" ${idx===arr.length-1?'disabled':''} class="text-[9px] t-mut hover:text-acc disabled:opacity-25">▼</button></span>`:'';
        const secSel=!isChron&&S.skillSections.length?`<select data-sk-sec-sel="${sk.id}" data-tip="Sektion / Ordner zuordnen" class="inp py-0.5 px-1.5 text-[11px] font-semibold max-w-[130px] shrink-0"><option value="" ${!sk.sectionId?'selected':''}>📁 Ohne</option>${S.skillSections.map(s=>`<option value="${s.id}" ${sk.sectionId===s.id?'selected':''}>📁 ${esc(s.name||'Sektion')}</option>`).join('')}</select>`:'';
        const skColStyle=sk.color?`style="color:${esc(sk.color)}"`:'';
        const skColBtns=isChron
          ?`<button type="button" data-action="open-sk-color" data-id="${sk.id}" data-cmode="text" data-tip="Textfarbe der Fertigkeit anpassen" class="btn w-6 h-6 p-0 text-[10px] shrink-0" ${sk.color?`style="border-color:${esc(sk.color)}"`:''}>🎨</button><button type="button" data-action="open-sk-color" data-id="${sk.id}" data-cmode="bg" data-tip="Fensterfarbe der Fertigkeit anpassen" class="btn w-6 h-6 p-0 text-[10px] shrink-0" ${sk.bgColor?`style="border-color:${esc(sk.bgColor)};background:color-mix(in srgb,${esc(sk.bgColor)} 35%,var(--surf2))"`:''}>🪟</button>`
          :`<button type="button" data-action="open-sk-color" data-id="${sk.id}" data-cmode="text" data-tip="Textfarbe der Fertigkeit anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${sk.color?`style="border-color:${esc(sk.color)}"`:''}>🎨</button><button type="button" data-action="open-sk-color" data-id="${sk.id}" data-cmode="bg" data-tip="Fensterfarbe der Fertigkeit anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${sk.bgColor?`style="border-color:${esc(sk.bgColor)};background:color-mix(in srgb,${esc(sk.bgColor)} 35%,var(--surf2))"`:''}>🪟</button>`;
        const nm=isChron
          ?`<td><div class="flex items-center gap-1.5">${dragBtn}${moveBtns}<input data-sk="${sk.id}:name" type="text" value="${esc(sk.name)}" ${skColStyle} class="inp-line w-full font-bold"/>${skColBtns}</div></td>`
          :`<td><div class="flex items-center gap-1.5">${dragBtn}${moveBtns}${(()=>{const skAd=getAdvDisForContext({skillId:sk.id,attrKey:sk.linkedAttr}),adTip=fmtAdvSrcLines(skAd.src),skBadge=(skAd.autoAdv||skAd.autoDis)?`<span class="text-[10px] font-black ${skAd.autoAdv>=skAd.autoDis?'text-emerald-400':'text-rose-400'}">${skAd.autoAdv?`+${skAd.autoAdv}V`:''}${skAd.autoDis?`${skAd.autoAdv?'/':''}+${skAd.autoDis}N`:''}</span>`:'';return `<button type="button" id="skRollBtn_${sk.id}" data-action="roll-skill" data-id="${sk.id}" data-tip="${esc(`Probe auf ${sk.name} (${pool} = ${sk.linkedAttr} ${av} ${fmtSign(effB)}${hasOvr?` • Manuell, Grad: +${autoB}`:''})${adTip?'\n'+adTip:''}`)}" class="btn bg-acc-soft bdr-acc text-acc font-black py-1 px-2.5 shrink-0 tabular"><span>🎲 ${pool}</span>${skBadge}</button>`;})()}<input data-sk="${sk.id}:name" type="text" value="${esc(sk.name)}" ${skColStyle} class="inp-line w-full font-extrabold"/>${skColBtns}${secSel}</div></td>`;
        const bonCtrl=`<div class="inline-flex items-center justify-center gap-1 tabular">
          <input id="skBon_${isChron?'chr_':''}${sk.id}" data-sk-bon="${sk.id}" type="text" inputmode="numeric" value="${fmtSign(effB)}" data-tip="${hasOvr?`Manueller Bonus-Overwrite aktiv (Grad-Standard: +${autoB})\nFeld leeren oder auf (+${autoB}) klicken für Standard`:`Fertigkeitsbonus (${SK_RANKS[sk.rank]?.n||'Ungelernt'}: +${autoB})\nDirekt eintippen für eigenen Bonus außerhalb von +10/+15/+20/+30`}" class="inp w-14 text-center py-0.5 px-1 text-xs font-extrabold ${hasOvr?'!border-amber-400 text-amber-300':'text-acc'}"/>
          <button type="button" id="skBonReset_${isChron?'chr_':''}${sk.id}" data-action="reset-sk-bon" data-id="${sk.id}" data-tip="Manueller Bonus aktiv – Klicken für Grad-Standard (+${autoB})" class="text-[11px] font-black text-amber-400 hover:underline ${hasOvr?'':'hidden'}">(+${autoB})</button>
        </div>`;
        const costControls=`<div class="inline-flex items-center justify-center gap-1 tabular">
          <input data-skcost="${sk.id}:sp" type="text" inputmode="numeric" value="${c.sp}" data-tip="SP-Kosten direkt überschreiben (z.B. 0 = Geschenkt; Standard: ${c.autoSp} SP)" class="inp w-12 text-center py-0.5 px-1 text-xs font-extrabold ${c.manual?'!border-amber-400 text-amber-300':''}"/>
          <span class="text-[10px] t-mut font-bold">SP</span>
          ${isChron?`</td><td class="text-center"><input data-skcost="${sk.id}:msp" type="text" inputmode="numeric" value="${c.msp}" data-tip="MsP-Kosten direkt überschreiben (Standard: ${c.autoMsp} MsP)" class="inp w-12 text-center py-0.5 px-1 text-xs font-extrabold ${c.msp?'text-amber-400':''}"/>`:`${c.msp?`<span class="text-[10px] font-black text-amber-500">+${c.msp}M</span>`:''}`}
          <button type="button" data-action="gift-sk" data-id="${sk.id}" data-tip="${c.manual&&c.sp===0&&c.msp===0?`Geschenkt aktiv (0 SP) – Klicken für Standardkosten (${c.autoSp} SP${c.autoMsp?` + ${c.autoMsp} MsP`:''})`:'Als geschenkt markieren (0 SP / 0 MsP) – Toggle'}" class="btn py-0.5 px-1.5 text-[10px] ${c.manual&&c.sp===0&&c.msp===0?'btn-ok':''}">🎁</button>
        </div>`;
        const mid=isChron
          ?`<td><div class="flex items-center gap-1.5"><select data-sk-sel="${sk.id}:rank" class="inp py-1 px-1.5 text-xs font-bold">${SK_RANKS.map(r=>`<option value="${r.r}" ${sk.rank===r.r?'selected':''}>${r.n} (+${r.b})</option>`).join('')}</select>${bonCtrl}</div></td><td class="text-center">${costControls}</td>`
          :`${[1,2,3,4].map(rk=>{const on=sk.rank>=rk;return `<td class="text-center"><button type="button" data-action="set-sk-rank" data-id="${sk.id}" data-rank="${rk}" class="btn w-7 h-7 p-0 text-xs ${on?(rk===4?'bg-amber-500 text-slate-950 border-amber-400 font-black':'btn-ok font-black'):''}">${on?'✕':''}</button></td>`;}).join('')}<td class="text-center">${bonCtrl}</td><td class="text-center">${costControls}</td>`;
        return `<tr data-sk-row="${sk.id}" ${sk.bgColor?`style="background:color-mix(in srgb,${esc(sk.bgColor)} 22%,transparent)"`:''}>${nm}<td><select data-sk-sel="${sk.id}:linkedAttr" class="inp py-1 px-1.5 text-xs font-bold">${skAttrOpts(sk.linkedAttr)}</select></td><td><select data-sk-sel="${sk.id}:category" class="inp py-1 px-1.5 text-xs font-semibold">${skCatOpts(sk.category)}</select></td>${mid}<td><input data-sk="${sk.id}:notes" type="text" value="${esc(sk.notes)}" placeholder="Notiz..." class="inp-line w-full text-xs"/></td><td class="text-right"><button type="button" data-action="del-skill" data-id="${sk.id}" class="t-mut hover:text-rose-500 font-bold px-1">✕</button></td></tr>`;
      }).join('');
    }

    const skSortIcon=col=>UI.skSort?.col===col?(UI.skSort.asc?' ▲':' ▼'):' ⇅';
    const skSortBtn=(col,lbl,align='text-left',tip='')=>`<button type="button" data-action="sort-sk-col" data-col="${col}" ${tip?`data-tip="${tip}"`:''} class="hover:text-acc font-extrabold inline-flex items-center gap-0.5 ${align} ${UI.skSort?.col===col?'text-acc':''}">${lbl}<span class="text-[10px] opacity-75">${skSortIcon(col)}</span></button>`;

    function renderSkTable(skList){
      return `<div class="overflow-x-auto"><table class="tbl min-w-[960px] text-sm"><thead><tr><th class="text-left">${skSortBtn('name','🎲 Probe &amp; Fertigkeit','text-left','Alphabetisch sortieren (auf-/absteigend)')}</th><th class="text-left">${skSortBtn('attr','Attribut','text-left','Nach Attribut &amp; höchstem Wert sortieren')}</th><th class="text-left">${skSortBtn('cat','Kategorie','text-left','Nach Kategorie sortieren')}</th><th class="text-center">Nov. +10</th><th class="text-center">Ges. +15</th><th class="text-center">Exp. +20</th><th class="text-center">Mei. +30</th><th class="text-center">${skSortBtn('bonus','Bonus (Overwrite)','text-center','Nach aktivem Fertigkeitsbonus sortieren (direkt eintippbar für eigene Boni)')}</th><th class="text-center">${skSortBtn('sp','Kosten (SP)','text-center','Nach SP-Kosten sortieren')}</th><th class="text-left">Notizen</th><th></th></tr></thead><tbody>${renderSkillRows(false,skList)}</tbody></table></div>`;
    }

    function renderSkSection(sec,sIdx,sibLen=1,depth=0){
      const secSkills=S.skills.filter(sk=>sk.sectionId===sec.id), childSecs=S.skillSections.filter(s=>(s.parentSectionId||'')===sec.id);
      const colStyle=sec.color?`style="color:${esc(sec.color)}"`:'', winStyle=cardColorStyle(sec);
      const isPullAsk=UI.confirmSkSecPullId===sec.id, isDelAsk=UI.confirmDelSkSecId===sec.id;
      const filterLbl=sec.filterAttr?(sec.filterAttr.startsWith('cat:')?SK_CATS[sec.filterAttr.slice(4)]?.l:sec.filterAttr):'';
      const validParents=S.skillSections.filter(s=>canSetSecParent(S.skillSections,sec.id,s.id));
      const parentSel=S.skillSections.length>1?`<select data-sksec-parent="${sec.id}" data-tip="Übergeordnete Sektion wählen (Ordner in Ordner verschachteln)" class="inp py-1 px-2 text-xs font-semibold max-w-[165px]"><option value="" ${!sec.parentSectionId?'selected':''}>📁 Hauptebene</option>${validParents.map(s=>`<option value="${s.id}" ${sec.parentSectionId===s.id?'selected':''}>↳ in: ${esc(s.name||'Sektion')}</option>`).join('')}</select>`:'';
      return `<section data-sk-sec="${sec.id}" class="card space-y-3 border-2 bdr-acc ${depth>0?'bg-black/15':''}" ${winStyle}>
        <div class="flex flex-wrap items-center justify-between gap-2 ${sec.collapsed?'':'border-b bdr-line pb-2.5'}">
          <div class="flex items-center gap-1.5 flex-1 min-w-[200px]">
            <button type="button" data-action="toggle-sksec-collapse" data-id="${sec.id}" data-tip="${sec.collapsed?'Sektion ausklappen':'Sektion einklappen'}" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">${sec.collapsed?'▸':'▾'}</button>
            <span draggable="true" data-drag-sksec="${sec.id}" data-tip="Ziehen zum Sortieren oder in eine andere Sektion legen" class="w-7 h-7 rounded bg-acc-soft border bdr-acc text-acc text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>
            ${depth>0?`<span class="text-xs font-black text-acc shrink-0" data-tip="Untersektion (Ebene ${depth+1})">↳</span>`:''}
            <input data-sksecf="${sec.id}:name" type="text" value="${esc(sec.name)}" ${colStyle} placeholder="Sektionsname (z.B. Kampffertigkeiten, Wissen)..." class="inp-line flex-1 min-w-[130px] text-base font-black"/>
            <button type="button" data-action="open-sksec-color" data-id="${sec.id}" data-cmode="text" data-tip="Textfarbe der Sektion anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${sec.color?`style="border-color:${esc(sec.color)}"`:''}>🎨</button>
            <button type="button" data-action="open-sksec-color" data-id="${sec.id}" data-cmode="bg" data-tip="Fensterfarbe der Sektion anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${sec.bgColor?`style="border-color:${esc(sec.bgColor)};background:color-mix(in srgb,${esc(sec.bgColor)} 35%,var(--surf2))"`:''}>🪟</button>
            <span class="pill cursor-default text-[11px] py-0.5 px-2 tabular">${secSkills.length} ${secSkills.length===1?'Fertigkeit':'Fertigkeiten'}${childSecs.length?` • ${childSecs.length} Unterordner`:''}</span>
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            ${parentSel}
            <select data-sksec-filter="${sec.id}" data-tip="Optionaler Filter, um auf Anforderung alle Fertigkeiten eines Attributs oder einer Kategorie hierher zu ziehen &amp; A–Z zu sortieren" class="inp py-1 px-2 text-xs font-bold">
              <option value="" ${!sec.filterAttr?'selected':''}>— Sortierfilter (optional) —</option>
              <optgroup label="Nach Attribut">
                ${ATTRS.map(a=>`<option value="${a.k}" ${sec.filterAttr===a.k?'selected':''}>Attribut: ${a.k} (${a.n})</option>`).join('')}
              </optgroup>
              <optgroup label="Nach Kategorie">
                ${Object.entries(SK_CATS).map(([k,v])=>`<option value="cat:${k}" ${sec.filterAttr==='cat:'+k?'selected':''}>Kategorie: ${v.l}</option>`).join('')}
              </optgroup>
            </select>
            ${sec.filterAttr?(isPullAsk
              ?`<span class="inline-flex items-center gap-1"><button type="button" data-action="confirm-sksec-pull" data-id="${sec.id}" class="btn bg-amber-500 text-slate-950 border-amber-400 py-1 px-2.5 text-[11px] font-black">Sicher: Alle Fertigkeiten mit „${esc(filterLbl)}“ hierher verschieben? (2/2)</button><button type="button" data-action="cancel-sksec-pull" class="btn py-1 px-2 text-[11px]">✕</button></span>`
              :`<button type="button" data-action="ask-sksec-pull" data-id="${sec.id}" data-tip="Zweistufige Sicherheitsabfrage (1/2): Zieht nach Bestätigung alle Fertigkeiten mit „${esc(filterLbl)}“ in diese Sektion und sortiert sie alphabetisch" class="btn bg-acc-soft bdr-acc text-acc py-1 px-2.5 text-xs">📥 Alle „${esc(filterLbl)}“ sammeln &amp; A–Z</button>`
            ):''}
            ${secSkills.length>1?`<button type="button" data-action="sort-sksec-az" data-id="${sec.id}" data-tip="Fertigkeiten in dieser Sektion alphabetisch sortieren" class="btn py-1 px-2 text-xs">⇅ A–Z</button>`:''}
            <button type="button" data-action="add-sk-section" data-parent="${sec.id}" data-tip="Untersektion in dieser Sektion erstellen" class="btn bg-acc-soft bdr-acc text-acc py-1 px-2 text-xs">+ Untersektion</button>
            <button type="button" data-action="add-sk-in-sec" data-sec="${sec.id}" data-tip="Neue Fertigkeit direkt in dieser Sektion anlegen" class="btn btn-pri py-1 px-2.5 text-xs">+ Fertigkeit</button>
            ${sibLen>1?`<button type="button" data-action="move-sksec" data-id="${sec.id}" data-dir="-1" ${sIdx===0?'disabled':''} class="btn py-1 px-2 text-xs">▲</button><button type="button" data-action="move-sksec" data-id="${sec.id}" data-dir="1" ${sIdx===sibLen-1?'disabled':''} class="btn py-1 px-2 text-xs">▼</button>`:''}
            ${isDelAsk?`<span class="inline-flex items-center gap-1"><button type="button" data-action="confirm-del-sksec" data-id="${sec.id}" class="btn bg-rose-600 text-white border-rose-600 py-1 px-2 text-[11px] font-black">Sektion löschen? (2/2)</button><button type="button" data-action="cancel-del-sksec" class="btn py-1 px-2 text-[11px]">✕</button></span>`:`<button type="button" data-action="ask-del-sksec" data-id="${sec.id}" data-tip="Sektion entfernen (enthaltene Fertigkeiten &amp; Untersektionen bleiben erhalten)" class="btn btn-err py-1 px-2 text-xs">✕</button>`}
          </div>
        </div>
        ${!sec.collapsed?((secSkills.length||childSecs.length)?`<div class="space-y-4">${secSkills.length?renderSkTable(secSkills):''}${childSecs.length?`<div class="pl-4 sm:pl-6 border-l-2 bdr-acc space-y-4 pt-1">${childSecs.map((cs,ci)=>renderSkSection(cs,ci,childSecs.length,depth+1)).join('')}</div>`:''}</div>`:`<div class="subcard border-dashed text-center py-5 text-xs t-mut">Ziehe Fertigkeiten oder Sektionen am Viereck ⠿ per Drag &amp; Drop hierher, nutze den Sammler oder klicke auf „+ Fertigkeit“.</div>`):''}
      </section>`;
    }

    function tplSkills(){
      const P=calcProg(), unsecSkills=S.skills.filter(sk=>!sk.sectionId||!S.skillSections.some(s=>s.id===sk.sectionId)), hasSec=S.skillSections.length>0;
      return `<section class="card space-y-3">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <h2 class="text-base sm:text-lg font-extrabold cursor-help" data-tip="Live synchron mit der Steigerungschronik.\nErstelle beliebige Sektionen (Ordner), ziehe Fertigkeiten an ⠿ hinein oder gib im Feld „Bonus“ eigene Boni außerhalb von +10/+15/+20/+30 ein.">Fertigkeiten</h2>
              <span class="text-xs t-mut">Aktuelle Kosten: <strong class="text-acc tabular">${P.skSp} SP${P.skMsp?` + ${P.skMsp} MsP`:''}</strong></span>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            ${hasSec?`<button type="button" data-action="collapse-all-sk" data-val="1" class="btn py-1 px-2.5 text-xs">▸ Alle einklappen</button><button type="button" data-action="collapse-all-sk" data-val="0" class="btn py-1 px-2.5 text-xs">▾ Alle ausklappen</button>`:''}
            ${S.skills.length>1?`<button type="button" data-action="sort-skills-az" class="btn py-1 px-2.5 text-xs">⇅ A–Z sortieren</button>`:''}
            <button type="button" data-action="add-sk-section" class="btn bg-acc-soft bdr-acc text-acc">+ Sektion</button>
          </div>
        </div>
        <form id="formAddSkill2" class="subcard p-2.5 flex flex-wrap items-center gap-2">
          <input id="skName2" type="text" placeholder="Fertigkeit (z.B. Schießen)" class="inp flex-1 min-w-[160px]"/>
          <select id="skAttr2" class="inp font-bold">${skAttrOpts('PR')}</select>
          <select id="skCat2" class="inp font-semibold">${skCatOpts('fundamental')}</select>
          <select id="skRank2" class="inp font-semibold">${SK_RANKS.map(r=>`<option value="${r.r}" ${r.r===1?'selected':''}>${r.n} (+${r.b})</option>`).join('')}</select>
          <input id="skBonOvr2" type="text" inputmode="numeric" placeholder="Bonus-Ovr. (opt.)" data-tip="Optional: Eigener Bonus außerhalb der festen Grade +10/+15/+20/+30 (z.B. +25 oder +5)" class="inp w-32 text-center font-bold tabular"/>
          ${hasSec?`<select id="skSec2" class="inp font-semibold max-w-[160px]"><option value="">📁 Ohne Sektion</option>${S.skillSections.map(s=>`<option value="${s.id}">📁 ${esc(s.name||'Sektion')}</option>`).join('')}</select>`:''}
          <button type="submit" class="btn btn-ok">+ Eintragen</button>
        </form>
        ${!hasSec?(S.skills.length?renderSkTable(S.skills):`<div class="py-6 text-center text-xs t-mut">Noch keine Fertigkeiten eingetragen (Standardgrad: Novize +10).</div>`):''}
      </section>
      ${hasSec?(()=>{const rootSkSecs=S.skillSections.filter(s=>!s.parentSectionId||!S.skillSections.some(p=>p.id===s.parentSectionId));return `<div class="space-y-5">${rootSkSecs.map((sec,sIdx)=>renderSkSection(sec,sIdx,rootSkSecs.length,0)).join('')}</div>`;})():''}
      ${hasSec?(unsecSkills.length?`<section data-sk-sec="" class="card space-y-3"><div class="flex items-center justify-between"><h3 class="text-sm font-extrabold t-mut">Fertigkeiten ohne Sektion (${unsecSkills.length})</h3><span class="text-[11px] t-mut">Hierher ziehen zum Herauslösen aus einer Sektion</span></div>${renderSkTable(unsecSkills)}</section>`:(S.skills.length?`<div data-sk-sec="" class="subcard border-dashed text-center py-3 text-xs t-mut">Hierher ziehen, um eine Fertigkeit aus einer Sektion herauszulösen</div>`:'')):''}`;
    }

    function renderDelConfirm(kind,id,compact=false){
      if(UI.confirmDelId===id) return `<span class="inline-flex items-center gap-1"><button type="button" data-action="confirm-del-pw" data-kind="${kind}" data-id="${id}" class="btn bg-rose-600 text-white border-rose-600 py-1 px-2 text-[11px] font-black">Sicher? (2/2)</button><button type="button" data-action="cancel-del-pw" class="btn py-1 px-2 text-[11px]">✕</button></span>`;
      return compact?`<button type="button" data-action="ask-del-pw" data-id="${id}" class="t-mut hover:text-rose-500 font-bold px-1">✕</button>`:`<button type="button" data-action="ask-del-pw" data-id="${id}" data-tip="Zweistufige Sicherheitsabfrage" class="btn btn-err py-1 px-2.5 text-xs">Entfernen</button>`;
    }

    function renderPwCostSelect(kind,it){
      const c=calcPwCost(it), gi=getGroupMspInfo(kind,it);
      return `<select data-pw-tier="${kind}:${it.id}" class="inp w-full font-semibold tabular ${gi.overLimit?'!border-rose-500 !text-rose-300':''}">${Object.entries(PW_TIERS).map(([k,t])=>{
        const sel=it.tier===k, warn=k==='grandios'&&gi.otherHasMsp;
        const txt=sel&&it.manualCost?`${t.full} (Manuell: ${c.sp} SP${c.msp?` + ${c.msp} MsP`:''})`:t.full;
        return `<option id="pwOpt_${it.id}_${k}" value="${k}" ${sel?'selected':''} ${warn?'style="background:#4c0519;color:#fda4af;font-weight:800"':''}>${warn?`⚠ ${txt} (1 MsP belegt)`:txt}</option>`;
      }).join('')}</select>`;
    }

    function buildTokBarInnerHtml(kind,it){
      const tokens=getAllParsedEffectChips(it.effects);
      return `<div class="flex flex-wrap items-center gap-1">${tokens.length?tokens.map((tk,ti)=>{
        const isAdv=tk.chipType==='adv', isDis=tk.chipType==='dis', isSt=tk.chipType==='status';
        const cls=isSt?'!border-amber-400/60 !bg-amber-500/15 !text-amber-300':isDis?'!border-rose-500/45 !bg-rose-500/15 !text-rose-300':isAdv?'!border-sky-400/50 !bg-sky-500/15 !text-sky-300':'!border-emerald-500/40 !bg-emerald-500/10 !text-emerald-300';
        const tip=isSt?`data-tip="${esc(`Statuseffekt-Baustein: Aktiviert „${tk.statusName}“ (${tk.stacks}× Stapel) erst beim Klick auf „⚡ Einsetzen“ (nicht passiv dauerhaft).`)}"`:(isAdv||isDis)?`data-tip="${esc(`Erkannter Proben-Effekt: ${fmtSign(tk.val)} ${isDis?'Nachteil(e)':'Vorteil(e)'} → ${tk.label}`)}"`:'';
        const sub=isSt?`<span class="opacity-85 text-[10px]">⚡ bei Einsetzen</span>`:(isAdv||isDis)&&!tk.isBracket?`<span class="opacity-75 text-[10px]">→ ${esc(tk.label)}</span>`:'';
        return `<span ${tip} class="tag ${cls} tabular ${tip?'cursor-help':''}"><span>${esc(tk.raw)}</span>${sub}<button type="button" data-action="rm-token" data-kind="${kind}" data-id="${it.id}" data-tidx="${ti}" class="hover:text-rose-400 font-black ml-0.5">✕</button></span>`;
      }).join(''):`<span class="text-[11px] t-mut">Keine Werte-/Proben-Bausteine erkannt (z.B. [+5 LP-Max], [Status: Gestärkt], [+4 Vorteile (Trefferwürfe)], +2 Vorteil auf Parieren).</span>`}</div>
      <button type="button" data-action="toggle-apply-mods" data-kind="${kind}" data-id="${it.id}" data-tip="Verrechnet alle Werte- &amp; Vor-/Nachteils-Effekte dieser Karte live mit Bogen und Würfelassistent" class="btn py-1 px-2.5 text-[11px] ${it.applyMods?'btn-ok':'opacity-80'}">${it.applyMods?'✓ Auf Bogen aktiv':'⚡ Auf Bogen anwenden'}</button>`;
    }

    function renderPwCard(kind,it,badgeLbl,idx,listLen){
      const isAug=kind==='augment', c=calcPwCost(it), gi=getGroupMspInfo(kind,it), colStyle=it.color?`style="color:${esc(it.color)}"`:'', winStyle=cardColorStyle(it);
      const pOpts=isAug?`<option value="" ${!it.parentPowerId?'selected':''}>— Freies Augment —</option>`+S.powers.map(p=>{const cnt=getLinkedAugs(p.id).length,full=cnt>=3&&it.parentPowerId!==p.id;return `<option value="${p.id}" ${it.parentPowerId===p.id?'selected':''} ${full?'disabled':''}>${esc(p.name||'Unbenannte Kraft')} (${cnt}/3)</option>`;}).join(''):'';
      const secOpts=!isAug&&S.powerSections.length?`<select data-pw-sec-sel="${it.id}" data-tip="Sektion / Ordner zuordnen" class="inp py-1 px-2 text-xs font-semibold max-w-[160px]"><option value="" ${!it.sectionId?'selected':''}>📁 Ohne Sektion</option>${S.powerSections.map(s=>`<option value="${s.id}" ${it.sectionId===s.id?'selected':''}>📁 ${esc(s.name||'Sektion')}</option>`).join('')}</select>`:'';
      const hdrLeft=`<button type="button" data-action="toggle-pw-collapse" data-kind="${kind}" data-id="${it.id}" data-tip="${it.collapsed?'Ausklappen':'Einklappen (nur Titel anzeigen)'}" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">${it.collapsed?'▸':'▾'}</button>
        ${!isAug?`<span draggable="true" data-drag-pw="${it.id}" data-tip="Ziehen zum Verschieben der Kraft (inkl. gebundener Augmente)" class="w-7 h-7 rounded bg-acc-soft border bdr-acc text-acc text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>`:`<span draggable="true" data-drag-aug="${it.id}" data-tip="Ziehen oder ▲/▼ nutzen zum Sortieren des Augments" class="w-7 h-7 rounded text-xs font-black bg-amber-500/15 text-amber-400 border border-amber-500/40 cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>`}
        <input data-pwf="${kind}:${it.id}:name" type="text" value="${esc(it.name)}" ${colStyle} placeholder="Name ${isAug?'des Augments':'der Kraft'}..." class="inp-line flex-1 min-w-[140px] ${it.collapsed?'text-sm':'text-base'} font-extrabold"/>
        <button type="button" data-action="open-pw-color" data-kind="${kind}" data-id="${it.id}" data-cmode="text" data-tip="Textfarbe (Name) anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${it.color?`style="border-color:${esc(it.color)}"`:''}>🎨</button>
        <button type="button" data-action="open-pw-color" data-kind="${kind}" data-id="${it.id}" data-cmode="bg" data-tip="Fensterfarbe (Hintergrund) anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${it.bgColor?`style="border-color:${esc(it.bgColor)};background:color-mix(in srgb,${esc(it.bgColor)} 35%,var(--surf2))"`:''}>🪟</button>`;
      const stToksInCard=parseStatusTokens(it.effects), hasUseCost=Boolean(it.useRes&&toInt(it.useAmt,0)>0), canSpendPw=hasUseCost||stToksInCard.length>0;
      const hdrRight=`<div class="flex flex-wrap items-center gap-1.5">
        ${it.collapsed?`<span class="pill cursor-default text-[11px] py-0.5 px-2 tabular">${c.sp} SP${c.msp?` + ${c.msp} MsP`:''}</span>${canSpendPw?`<button type="button" data-action="spend-pw" data-kind="${kind}" data-id="${it.id}" class="btn btn-pri py-0.5 px-2 text-[11px]">⚡ ${hasUseCost?`${it.useAmt} ${esc(getResLabel(it.useRes))}`:'Einsetzen'}</button>`:''}`:''}
        ${!isAug&&!it.collapsed?secOpts:''}
        ${isAug&&!it.collapsed?`<select data-ag-link="${it.id}" data-tip="Einer Kraft zuordnen (max. 3 Slots)" class="inp py-1 px-2 text-xs font-bold max-w-[200px]">${pOpts}</select>`:''}
        ${listLen>1?`<button type="button" data-action="${isAug?'move-aug':'move-pw'}" data-id="${it.id}" data-dir="-1" ${idx===0?'disabled':''} class="btn py-1 px-2 text-xs">▲${!isAug&&!it.collapsed?' Nach oben':''}</button><button type="button" data-action="${isAug?'move-aug':'move-pw'}" data-id="${it.id}" data-dir="1" ${idx===listLen-1?'disabled':''} class="btn py-1 px-2 text-xs">▼${!isAug&&!it.collapsed?' Nach unten':''}</button>`:''}
        ${renderDelConfirm(kind,it.id,it.collapsed)}
      </div>`;

      if(it.collapsed){
        return `<div ${isAug?`data-aug-card="${it.id}"`:""} class="card py-2 px-3 ${isAug?'border-amber-500/45 max-w-4xl':''}" ${winStyle}><div class="flex flex-wrap items-center justify-between gap-2">${hdrLeft}${hdrRight}</div></div>`;
      }

      const statGroups=getStatGroups();
      const bldToken=formatBldToken(it.bldAmt,it.bldStat);
      const hD=it.boxH?.desc>0?`style="height:${it.boxH.desc}px"`:'', hE=it.boxH?.effects>0?`style="height:${it.boxH.effects}px"`:'', hR=it.boxH?.rules>0?`style="height:${it.boxH.rules}px"`:'';
      const availSubs=S.subcatList.filter(s=>!it.subcats.includes(s));
      const linked=!isAug?getLinkedAugs(it.id):[], unlinked=!isAug?getUnlinkedAugs():[];
      return `<div ${isAug?`data-aug-card="${it.id}"`:""} class="card space-y-3 ${isAug?'border-amber-500/45':''}" ${winStyle}>
        <div class="flex flex-wrap items-center justify-between gap-2 border-b bdr-line pb-2">${hdrLeft}${hdrRight}</div>
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 text-xs">
          <div class="md:col-span-4"><label class="font-bold t-mut block mb-1">Voraussetzungen</label><input data-pwf="${kind}:${it.id}:req" type="text" value="${esc(it.req)}" placeholder="z.B. ST 30..." class="inp w-full"/></div>
          <div class="md:col-span-4">
            <div class="flex items-center justify-between mb-1"><label class="font-bold t-mut flex items-center gap-1.5"><span>Lernkosten</span>${gi.overLimit?`<span class="text-[10px] font-extrabold text-rose-400" data-tip="Mehr als 1 MsP in dieser Kraft-Gruppe vergeben!">⚠ &gt;1 MsP</span>`:''}</label><div class="flex items-center gap-1.5"><button type="button" data-action="gift-pw" data-kind="${kind}" data-id="${it.id}" data-tip="${it.manualCost&&c.sp===0&&c.msp===0?'Geschenkt aktiv (0 SP) – Klicken für Standardkosten':'Als geschenkt setzen (0 SP / 0 MsP) – Toggle'}" class="btn py-0.5 px-1.5 text-[10px] ${it.manualCost&&c.sp===0&&c.msp===0?'btn-ok':''}">🎁</button><button type="button" data-action="toggle-pw-man" data-kind="${kind}" data-id="${it.id}" class="text-[10px] font-extrabold ${it.manualCost||it.showManual?'text-amber-400':'text-acc'} hover:underline">✎ Manuell${it.manualCost?' ★':''}</button></div></div>
            ${renderPwCostSelect(kind,it)}
            ${it.showManual||it.manualCost?`<div class="mt-1.5 p-2 rounded-lg border bdr-line flex items-center gap-2 tabular" style="background:var(--surf)"><label class="flex items-center gap-1 text-[11px] font-bold flex-1">SP <input data-pwcost="${kind}:${it.id}:sp" type="text" inputmode="numeric" value="${c.sp}" class="inp w-full text-center font-black py-0.5 px-1"/></label><label class="flex items-center gap-1 text-[11px] font-bold text-amber-500 flex-1">MsP <input data-pwcost="${kind}:${it.id}:msp" type="text" inputmode="numeric" value="${c.msp}" class="inp w-full text-center font-black py-0.5 px-1"/></label></div>`:''}
          </div>
          <div class="md:col-span-4">
            <div class="flex items-center justify-between mb-1"><label class="font-bold t-mut" data-tip="Zieht den Betrag per Klick auf „Einsetzen“ direkt oben vom Bogen ab.">Einsatzkosten</label><button type="button" data-action="open-list" data-ltype="useRes" data-tip="Einsatzkosten-Ressourcen anpassen" class="text-[11px] text-acc">⚙️</button></div>
            <div class="flex items-center gap-1.5"><input data-pwf="${kind}:${it.id}:useAmt" type="text" inputmode="numeric" value="${esc(it.useAmt)}" class="inp w-14 text-center font-black tabular"/><select data-pw-sel="${kind}:${it.id}:useRes" class="inp flex-1 min-w-0 font-bold"><option value="" ${!it.useRes?'selected':''}>— Keine —</option>${S.useResList.map(r=>`<option value="${esc(r)}" ${it.useRes===r?'selected':''}>${esc(getResLabel(r))}</option>`).join('')}</select><button type="button" data-action="spend-pw" data-kind="${kind}" data-id="${it.id}" ${!canSpendPw?'disabled':''} class="btn btn-pri py-1.5 px-2.5 text-xs shrink-0">⚡ Einsetzen</button></div>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 text-xs subcard p-2.5">
          <div class="md:col-span-5">
            <div class="flex items-center justify-between mb-1"><label class="font-bold t-mut">Art (Einzelauswahl)</label><div class="flex items-center gap-2"><button type="button" data-action="toggle-art-man" data-kind="${kind}" data-id="${it.id}" class="text-[10px] font-extrabold ${it.artManual?'text-amber-400':'text-acc'} hover:underline">✎ Manuell</button><button type="button" data-action="open-list" data-ltype="art" data-tip="Standardliste „Art“ bearbeiten" class="text-[11px]">⚙️</button></div></div>
            ${it.artManual?`<input data-pwf="${kind}:${it.id}:art" type="text" value="${esc(it.art)}" placeholder="Eigene Art..." class="inp w-full font-bold"/>`:`<select data-pw-sel="${kind}:${it.id}:art" class="inp w-full font-bold"><option value="" ${!it.art?'selected':''}>— Keine Art —</option>${S.artList.map(a=>`<option value="${esc(a)}" ${it.art===a?'selected':''}>${esc(a)}</option>`).join('')}${it.art&&!S.artList.includes(it.art)?`<option value="${esc(it.art)}" selected>${esc(it.art)} (Manuell)</option>`:''}</select>`}
          </div>
          <div class="md:col-span-7">
            <div class="flex items-center justify-between mb-1"><label class="font-bold t-mut">Unterkategorien (Mehrfach-Tags)</label><button type="button" data-action="open-list" data-ltype="subcat" data-tip="Standardliste „Unterkategorie“ bearbeiten" class="text-[11px]">⚙️</button></div>
            <div class="flex flex-wrap items-center gap-1.5">${it.subcats.map(sc=>`<span class="tag">${esc(sc)}<button type="button" data-action="rm-subcat" data-kind="${kind}" data-id="${it.id}" data-val="${esc(sc)}" class="hover:text-rose-400 font-black ml-0.5">✕</button></span>`).join('')}<select data-add-subcat="${kind}:${it.id}" class="inp py-1 px-2 text-xs font-semibold ${it.subcats.length?'w-auto':'w-full'}"><option value="">+ Tag hinzufügen...</option>${availSubs.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
          </div>
        </div>
        <div class="space-y-2.5 text-xs">
          <div><div class="flex items-center justify-between mb-1"><label class="font-bold t-mut">Beschreibung</label><span class="text-[10px] t-mut" data-tip="Markierten Text formatieren: Strg+B = Fett, Strg+I = Kursiv, Strg+U = Unterstrichen">Shortcuts: <b>B</b>/<i>I</i>/<u>U</u></span></div><div contenteditable="true" data-pwf="${kind}:${it.id}:desc" data-boxh="${kind}:${it.id}:desc" ${hD} data-ph="Kursiver Beschreibungstext..." class="inp w-full autogrow italic rtf-box">${toRtfHtml(it.desc)}</div></div>
          <div>
            <div class="flex flex-wrap items-center justify-between gap-1.5 mb-1">
              <label class="font-bold t-mut cursor-help" data-tip="Freitext &amp; Baukasten: Erkennt Werte wie [+5 LP-Max] sowie Vor-/Nachteile samt Einsatzgebiet (z.B. [+4 Vorteile (Trefferwürfe)], +4 Vorteile mit Trefferwürfen, +2 Vorteil auf Parieren, +1 Vorteil auf Ausweichen oder +2 Vorteile auf Schießen), solange ‚Auf Bogen aktiv‘ eingeschaltet ist.">Effekte</label>
              <div class="flex flex-wrap items-center gap-1">
                <input data-pwf="${kind}:${it.id}:bldAmt" type="text" value="${esc(it.bldAmt||'+1')}" class="inp w-12 text-center py-0.5 px-1 text-xs font-black tabular"/>
                <select data-pw-sel="${kind}:${it.id}:bldStat" class="inp py-0.5 px-1.5 text-xs font-bold max-w-[180px]">${statGroups.map(([gl,arr])=>`<optgroup label="${esc(gl)}">${arr.map(st=>`<option value="${esc(st)}" ${it.bldStat===st?'selected':''}>${esc(st)}</option>`).join('')}</optgroup>`).join('')}</select>
                <span id="chip_${it.id}" draggable="true" data-drag-tok="${esc(bldToken)}" data-tip="Ins Effektfeld ziehen oder „+ Baustein“ klicken" class="tag cursor-grab select-none tabular">⠿ ${esc(bldToken)}</span>
                <button type="button" data-action="ins-token" data-kind="${kind}" data-id="${it.id}" class="btn btn-ok py-0.5 px-2 text-[11px]">+ Baustein</button>
                <button type="button" data-action="open-list" data-ltype="customStats" data-tip="Eigene Baukasten-Variablen verwalten" class="btn py-0.5 px-1.5 text-[11px]">⚙️</button>
              </div>
            </div>
            <div contenteditable="true" id="eff_${it.id}" data-pwf="${kind}:${it.id}:effects" data-boxh="${kind}:${it.id}:effects" ${hE} data-ph="z.B. Erhöht dauerhaft deine Lebenskraft um [+5 LP-Max]..." class="inp w-full autogrow rtf-box">${toRtfHtml(it.effects)}</div>
            <div id="tokBar_${it.id}" class="flex flex-wrap items-center justify-between gap-2 mt-1.5">${buildTokBarInnerHtml(kind,it)}</div>
            ${(()=>{const prDef=UI.statusIniPromptKey&&stToksInCard.some(t=>t.statusKey===UI.statusIniPromptKey)?STATUS_DEFS.find(d=>d.k===UI.statusIniPromptKey):null;if(!prDef)return '';const pv=getStatusEffValues(prDef.k);return `<div class="mt-2 p-2.5 rounded-lg border border-amber-400/70 bg-amber-500/15 flex flex-wrap items-center justify-between gap-2 text-xs"><span class="font-extrabold text-amber-300">⚡ ${esc(prDef.name)} aktiviert: Initiative +${10*pv.stacks} oder −${10*pv.stacks} wählen?</span><div class="flex items-center gap-1.5"><button type="button" data-action="confirm-status-inidir" data-key="${prDef.k}" data-dir="1" class="btn py-0.5 px-2.5 text-xs font-black ${pv.iniDir>0?'bg-amber-500 text-slate-950 border-amber-400':'border-amber-400/50 text-amber-200'}">⚡ +${10*pv.stacks} Initiative</button><button type="button" data-action="confirm-status-inidir" data-key="${prDef.k}" data-dir="-1" class="btn py-0.5 px-2.5 text-xs font-black ${pv.iniDir<0?'bg-amber-500 text-slate-950 border-amber-400':'border-amber-400/50 text-amber-200'}">⚡ −${10*pv.stacks} Initiative</button></div></div>`;})()}
          </div>
          <div><label class="font-bold t-mut block mb-1">Zusätzliche Regeln &amp; Infos</label><div contenteditable="true" data-pwf="${kind}:${it.id}:rules" data-boxh="${kind}:${it.id}:rules" ${hR} data-ph="Reichweite, Dauer, Spezialregeln..." class="inp w-full autogrow rtf-box">${toRtfHtml(it.rules)}</div></div>
        </div>
        ${!isAug?`<div class="subcard space-y-2"><div class="flex items-center justify-between text-xs"><span class="font-extrabold text-amber-400">Augment-Slots (${linked.length} / 3 ausgerüstet)</span>${gi.overLimit?`<span class="text-[11px] font-bold text-rose-400">⚠ Kollektiv ${gi.totalMsp} MsP in dieser Gruppe</span>`:''}</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">${[0,1,2].map(sIdx=>{
          const ag=linked[sIdx];
          if(ag) return `<div class="p-2 rounded-lg border border-amber-500/45 bg-amber-500/10 flex items-center justify-between gap-1.5 text-xs"><div class="min-w-0"><span class="block text-[10px] font-black text-amber-400">SLOT ${sIdx+1} • AKTIV</span><span class="block font-extrabold truncate" ${ag.color?`style="color:${esc(ag.color)}"`:''}>${esc(ag.name||'Unbenanntes Augment')}</span></div><button type="button" data-action="unlink-aug" data-id="${ag.id}" data-tip="Verknüpfung lösen" class="btn py-0.5 px-2 text-[11px] border-amber-500/40 text-amber-300">✕</button></div>`;
          return `<div class="p-2 rounded-lg border border-dashed bdr-line flex flex-col gap-1.5 text-xs"><div class="flex items-center justify-between"><span class="text-[10px] font-bold t-mut">SLOT ${sIdx+1} • FREI</span><button type="button" data-action="new-linked-aug" data-pid="${it.id}" class="text-[10px] font-extrabold text-amber-400 hover:underline">+ Neu</button></div>${unlinked.length?`<select data-link-slot="${it.id}" class="inp py-0.5 px-1.5 text-[11px]"><option value="">Freies Augment linken...</option>${unlinked.map(u=>`<option value="${u.id}">${esc(u.name||'Unbenanntes Augment')}</option>`).join('')}</select>`:`<span class="text-[10px] t-mut italic">Kein freies Augment offen</span>`}</div>`;
        }).join('')}</div></div>`:''}
      </div>`;
    }

    const getPwFilterCnt=()=>(UI.pwFilterArts?.length||0)+(UI.pwFilterTiers?.length||0)+(UI.pwFilterSubs?.length||0);
    const hasActivePwFilter=()=>getPwFilterCnt()>0;
    function matchesPwItemFilter(it){
      if(!hasActivePwFilter()) return true;
      const itemArt=String(it?.art||'').trim();
      const isLegacyBasis=!it?.parentPowerId&&it?.tier==='marginal'&&it?.manualCost&&toInt(it?.sp,0)===0&&toInt(it?.msp,0)===0;
      const tKey=isLegacyBasis?'basisaktion':(PW_TIERS[it?.tier]?it.tier:'marginal');
      const itemSubs=Array.isArray(it?.subcats)?it.subcats.map(s=>String(s||'').trim()):[];
      const hasArts=(UI.pwFilterArts?.length||0)>0;
      const hasTiers=(UI.pwFilterTiers?.length||0)>0;
      const hasSubs=(UI.pwFilterSubs?.length||0)>0;
      const matchArt=hasArts&&UI.pwFilterArts.includes(itemArt);
      const matchTier=hasTiers&&UI.pwFilterTiers.includes(tKey);
      const matchSub=hasSubs&&itemSubs.some(sc=>UI.pwFilterSubs.includes(sc));
      if(UI.pwFilterMode==='and'){
        return (!hasArts||matchArt)&&(!hasTiers||matchTier)&&(!hasSubs||matchSub);
      }
      return Boolean(matchArt||matchTier||matchSub);
    }
    function matchesPwGroupFilter(p){
      if(!hasActivePwFilter()) return true;
      return matchesPwItemFilter(p)||getLinkedAugs(p.id).some(ag=>matchesPwItemFilter(ag));
    }

    function renderPwGroupList(pwArr){
      const fAct=hasActivePwFilter();
      return pwArr.map((p,i)=>{
        const pMatches=!fAct||matchesPwItemFilter(p);
        const allLinked=getLinkedAugs(p.id);
        const linked=fAct?allLinked.filter(matchesPwItemFilter):allLinked;
        if(!pMatches&&!linked.length) return '';
        if(!pMatches){
          return `<div data-pw-group="${p.id}" class="space-y-2.5">${linked.map((ag,ai)=>renderPwCard('augment',ag,'',ai,linked.length)).join('')}</div>`;
        }
        return `<div data-pw-group="${p.id}" class="space-y-2.5">${renderPwCard('power',p,'',i,pwArr.length)}${linked.length?`<div class="pl-4 sm:pl-7 border-l-2 border-amber-500/45 space-y-2.5">${linked.map((ag,ai)=>renderPwCard('augment',ag,'',ai,linked.length)).join('')}</div>`:''}</div>`;
      }).filter(Boolean).join('');
    }

    function secHasFilteredPowers(secId){
      if(S.powers.filter(p=>p.sectionId===secId).some(matchesPwGroupFilter)) return true;
      return S.powerSections.filter(s=>(s.parentSectionId||'')===secId).some(cs=>secHasFilteredPowers(cs.id));
    }
    function renderPwSection(sec,sIdx,sibLen=1,depth=0){
      const allSecPowers=S.powers.filter(p=>p.sectionId===sec.id), fAct=hasActivePwFilter(), secPowers=fAct?allSecPowers.filter(matchesPwGroupFilter):allSecPowers;
      if(fAct&&!secHasFilteredPowers(sec.id)) return '';
      const rawChildSecs=S.powerSections.filter(s=>(s.parentSectionId||'')===sec.id);
      const childSecs=fAct?rawChildSecs.filter(cs=>secHasFilteredPowers(cs.id)):rawChildSecs;
      const colStyle=sec.color?`style="color:${esc(sec.color)}"`:'', winStyle=cardColorStyle(sec);
      const isPullAsk=UI.confirmSecPullId===sec.id, isDelAsk=UI.confirmDelSecId===sec.id;
      const showBody=!sec.collapsed||fAct;
      const validParents=S.powerSections.filter(s=>canSetSecParent(S.powerSections,sec.id,s.id));
      const parentSel=S.powerSections.length>1?`<select data-sec-parent="${sec.id}" data-tip="Übergeordnete Sektion wählen (Ordner in Ordner verschachteln)" class="inp py-1 px-2 text-xs font-semibold max-w-[165px]"><option value="" ${!sec.parentSectionId?'selected':''}>📁 Hauptebene</option>${validParents.map(s=>`<option value="${s.id}" ${sec.parentSectionId===s.id?'selected':''}>↳ in: ${esc(s.name||'Sektion')}</option>`).join('')}</select>`:'';
      return `<section data-pw-sec="${sec.id}" class="card space-y-3 border-2 bdr-acc ${depth>0?'bg-black/15':''}" ${winStyle}>
        <div class="flex flex-wrap items-center justify-between gap-2 ${showBody?'border-b bdr-line pb-2.5':''}">
          <div class="flex items-center gap-1.5 flex-1 min-w-[200px]">
            <button type="button" data-action="toggle-sec-collapse" data-id="${sec.id}" data-tip="${sec.collapsed?'Sektion ausklappen':'Sektion einklappen'}" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">${sec.collapsed?'▸':'▾'}</button>
            <span draggable="true" data-drag-sec="${sec.id}" data-tip="Ziehen zum Sortieren oder in eine andere Sektion legen" class="w-7 h-7 rounded bg-acc-soft border bdr-acc text-acc text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>
            ${depth>0?`<span class="text-xs font-black text-acc shrink-0" data-tip="Untersektion (Ebene ${depth+1})">↳</span>`:''}
            <input data-secf="${sec.id}:name" type="text" value="${esc(sec.name)}" ${colStyle} placeholder="Sektionsname (z.B. Eigenschaften)..." class="inp-line flex-1 min-w-[130px] text-base font-black"/>
            <button type="button" data-action="open-sec-folder-color" data-id="${sec.id}" data-cmode="text" data-tip="Textfarbe der Sektion anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${sec.color?`style="border-color:${esc(sec.color)}"`:''}>🎨</button>
            <button type="button" data-action="open-sec-folder-color" data-id="${sec.id}" data-cmode="bg" data-tip="Fensterfarbe der Sektion anpassen" class="btn w-7 h-7 p-0 text-xs shrink-0" ${sec.bgColor?`style="border-color:${esc(sec.bgColor)};background:color-mix(in srgb,${esc(sec.bgColor)} 35%,var(--surf2))"`:''}>🪟</button>
            <span class="pill cursor-default text-[11px] py-0.5 px-2 tabular">${fAct?`${secPowers.length}/${allSecPowers.length}`:secPowers.length} ${allSecPowers.length===1&&!fAct?'Kraft':'Kräfte'}${childSecs.length?` • ${childSecs.length} Unterordner`:''}</span>
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            ${parentSel}
            <select data-sec-art="${sec.id}" data-tip="Optionale Art wählen, um auf Anforderung alle Kräfte dieser Art hierher zu ziehen &amp; A–Z zu sortieren" class="inp py-1 px-2 text-xs font-bold">
              <option value="" ${!sec.filterArt?'selected':''}>— Art-Sortierfilter (optional) —</option>
              ${S.artList.map(a=>`<option value="${esc(a)}" ${sec.filterArt===a?'selected':''}>Art: ${esc(a)}</option>`).join('')}
            </select>
            ${sec.filterArt?(isPullAsk
              ?`<span class="inline-flex items-center gap-1"><button type="button" data-action="confirm-sec-pull" data-id="${sec.id}" class="btn bg-amber-500 text-slate-950 border-amber-400 py-1 px-2.5 text-[11px] font-black">Sicher: Alle Kräfte mit „${esc(sec.filterArt)}“ hierher verschieben? (2/2)</button><button type="button" data-action="cancel-sec-pull" class="btn py-1 px-2 text-[11px]">✕</button></span>`
              :`<button type="button" data-action="ask-sec-pull" data-id="${sec.id}" data-tip="Zweistufige Sicherheitsabfrage (1/2): Zieht nach Bestätigung alle Kräfte mit „${esc(sec.filterArt)}“ (inkl. ihrer gebundenen Augmente) in diese Sektion und sortiert sie alphabetisch" class="btn bg-acc-soft bdr-acc text-acc py-1 px-2.5 text-xs">📥 Alle „${esc(sec.filterArt)}“ sammeln &amp; A–Z</button>`
            ):''}
            ${allSecPowers.length>1?`<button type="button" data-action="sort-sec-az" data-id="${sec.id}" data-tip="Kräfte in dieser Sektion (und ihre Augmente darunter) alphabetisch sortieren" class="btn py-1 px-2 text-xs">⇅ A–Z</button>`:''}
            <button type="button" data-action="add-pw-section" data-parent="${sec.id}" data-tip="Untersektion in dieser Sektion erstellen" class="btn bg-acc-soft bdr-acc text-acc py-1 px-2 text-xs">+ Untersektion</button>
            <button type="button" data-action="add-power" data-sec="${sec.id}" class="btn btn-pri py-1 px-2.5 text-xs">+ Kraft</button>
            ${sibLen>1?`<button type="button" data-action="move-sec" data-id="${sec.id}" data-dir="-1" ${sIdx===0?'disabled':''} class="btn py-1 px-2 text-xs">▲</button><button type="button" data-action="move-sec" data-id="${sec.id}" data-dir="1" ${sIdx===sibLen-1?'disabled':''} class="btn py-1 px-2 text-xs">▼</button>`:''}
            ${isDelAsk?`<span class="inline-flex items-center gap-1"><button type="button" data-action="confirm-del-sec" data-id="${sec.id}" class="btn bg-rose-600 text-white border-rose-600 py-1 px-2 text-[11px] font-black">Sektion löschen? (2/2)</button><button type="button" data-action="cancel-del-sec" class="btn py-1 px-2 text-[11px]">✕</button></span>`:`<button type="button" data-action="ask-del-sec" data-id="${sec.id}" data-tip="Sektion entfernen (enthaltene Kräfte &amp; Untersektionen bleiben erhalten)" class="btn btn-err py-1 px-2 text-xs">✕</button>`}
          </div>
        </div>
        ${showBody?((secPowers.length||childSecs.length)?`<div class="space-y-4 pt-1">${secPowers.length?renderPwGroupList(secPowers):''}${childSecs.length?`<div class="pl-4 sm:pl-6 border-l-2 bdr-acc space-y-4 pt-1">${childSecs.map((cs,ci)=>renderPwSection(cs,ci,childSecs.length,depth+1)).join('')}</div>`:''}</div>`:`<div class="subcard border-dashed text-center py-5 text-xs t-mut">Ziehe Kräfte oder Sektionen am Viereck ⠿ per Drag &amp; Drop hierher, nutze den Art-Sammler oder klicke auf „+ Kraft“.</div>`):''}
      </section>`;
    }

    function tplPowers(){
      const P=calcProg(), fAct=hasActivePwFilter(), fCnt=getPwFilterCnt();
      const allUnlinked=getUnlinkedAugs(), unlinked=fAct?allUnlinked.filter(matchesPwItemFilter):allUnlinked;
      const allUnsecPowers=S.powers.filter(p=>!p.sectionId||!S.powerSections.some(s=>s.id===p.sectionId)), unsecPowers=fAct?allUnsecPowers.filter(matchesPwGroupFilter):allUnsecPowers;
      const hasAny=S.powers.length>0||S.augments.length>0||S.powerSections.length>0;
      const allArts=sortAlpha([...S.artList,...S.powers.map(p=>p.art),...S.augments.map(a=>a.art)]);
      const allSubs=sortAlpha([...S.subcatList,...S.powers.flatMap(p=>p.subcats||[]),...S.augments.flatMap(a=>a.subcats||[])]);
      const matchedPwCnt=fAct?S.powers.filter(matchesPwItemFilter).length:S.powers.length;
      const matchedAugCnt=fAct?S.augments.filter(matchesPwItemFilter).length:S.augments.length;
      const totalMatchedCnt=matchedPwCnt+matchedAugCnt;
      const activeTagsHtml=fAct?`<div class="subcard p-2.5 border bdr-acc bg-acc-soft/30 flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="font-extrabold text-acc">🎯 Aktiver Filter (${totalMatchedCnt} ${totalMatchedCnt===1?'Treffer':'Treffer'}):</span>
          ${(UI.pwFilterArts||[]).map(a=>`<button type="button" data-action="toggle-pw-filter-opt" data-fkind="art" data-fval="${esc(a)}" data-tip="Filter entfernen" class="tag cursor-pointer">Art: ${esc(a)} ✕</button>`).join('')}
          ${(UI.pwFilterTiers||[]).map(k=>`<button type="button" data-action="toggle-pw-filter-opt" data-fkind="tier" data-fval="${esc(k)}" data-tip="Filter entfernen" class="tag cursor-pointer">Stufe: ${esc(PW_TIERS[k]?.l||k)} ✕</button>`).join('')}
          ${(UI.pwFilterSubs||[]).map(sc=>`<button type="button" data-action="toggle-pw-filter-opt" data-fkind="sub" data-fval="${esc(sc)}" data-tip="Filter entfernen" class="tag cursor-pointer">Tag: ${esc(sc)} ✕</button>`).join('')}
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] t-mut tabular">${matchedPwCnt} ${matchedPwCnt===1?'Kraft':'Kräfte'} • ${matchedAugCnt} ${matchedAugCnt===1?'Augment':'Augmente'}</span>
          <button type="button" data-action="reset-pw-filter" class="btn btn-err py-0.5 px-2 text-[11px]">↺ Alle einblenden</button>
        </div>
      </div>`:'';
      const filterMenuHtml=UI.pwFilterOpen?`<div class="subcard p-3 space-y-3 border bdr-acc bg-acc-soft/20 text-xs">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b bdr-line pb-2">
          <div class="font-extrabold text-acc flex flex-wrap items-center gap-2">
            <span>🔍 Live-Filter für Kräfte &amp; Augmente</span>
            ${fAct?`<span class="pill cursor-default text-[10px] py-0.5 px-2">${fCnt} gewählt • ${totalMatchedCnt} Treffer</span>`:`<span class="text-[11px] font-normal t-mut">(Blendet alle nicht passenden Kräfte &amp; Augmente aus)</span>`}
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            <button type="button" data-action="toggle-pw-filter-mode" data-tip="Wechselt zwischen Überschneidung (mindestens 1 gewähltes Filterkriterium trifft zu) und Kombination (alle gewählten Kategorien müssen zutreffen)" class="btn py-0.5 px-2.5 text-[11px] bdr-acc bg-acc-soft text-acc">Modus: ${UI.pwFilterMode==='and'?'Kombination (UND)':'Überschneidung (ODER)'} ↻</button>
            ${fAct?`<button type="button" data-action="reset-pw-filter" class="btn btn-err py-0.5 px-2.5 text-[11px]">↺ Filter zurücksetzen</button>`:''}
            <button type="button" data-action="toggle-pw-filter" class="btn py-0.5 px-2 text-[11px]">✕</button>
          </div>
        </div>
        <div class="space-y-1.5">
          <div class="text-[11px] font-extrabold t-mut uppercase tracking-wider">Kraft-Art (${allArts.length})</div>
          <div class="flex flex-wrap gap-1.5">${allArts.map(a=>{const on=(UI.pwFilterArts||[]).includes(a);return `<button type="button" data-action="toggle-pw-filter-opt" data-fkind="art" data-fval="${esc(a)}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border cursor-pointer select-none transition-colors ${on?'bdr-acc bg-acc-soft text-acc font-extrabold':'bdr-line bg-black/20 hover:border-sky-400/50'}"><span class="text-xs leading-none">${on?'☑':'☐'}</span><span>${esc(a)}</span></button>`;}).join('')}</div>
        </div>
        <div class="space-y-1.5 pt-1 border-t bdr-line">
          <div class="text-[11px] font-extrabold t-mut uppercase tracking-wider">Lernkosten-Stufe</div>
          <div class="flex flex-wrap gap-1.5">${Object.entries(PW_TIERS).map(([k,t])=>{const on=(UI.pwFilterTiers||[]).includes(k);return `<button type="button" data-action="toggle-pw-filter-opt" data-fkind="tier" data-fval="${esc(k)}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border cursor-pointer select-none transition-colors ${on?'bdr-acc bg-acc-soft text-acc font-extrabold':'bdr-line bg-black/20 hover:border-sky-400/50'}"><span class="text-xs leading-none">${on?'☑':'☐'}</span><span>${esc(t.l)}</span></button>`;}).join('')}</div>
        </div>
        ${allSubs.length?`<div class="space-y-1.5 pt-1 border-t bdr-line">
          <div class="text-[11px] font-extrabold t-mut uppercase tracking-wider">Unterkategorien (${allSubs.length})</div>
          <div class="flex flex-wrap gap-1.5">${allSubs.map(sc=>{const on=(UI.pwFilterSubs||[]).includes(sc);return `<button type="button" data-action="toggle-pw-filter-opt" data-fkind="sub" data-fval="${esc(sc)}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border cursor-pointer select-none transition-colors ${on?'bdr-acc bg-acc-soft text-acc font-extrabold':'bdr-line bg-black/20 hover:border-sky-400/50'}"><span class="text-xs leading-none">${on?'☑':'☐'}</span><span>${esc(sc)}</span></button>`;}).join('')}</div>
        </div>`:''}
      </div>`:'';
      const rawRootSecs=S.powerSections.filter(s=>!s.parentSectionId||!S.powerSections.some(p=>p.id===s.parentSectionId));
      const rootSecs=fAct?rawRootSecs.filter(s=>secHasFilteredPowers(s.id)):rawRootSecs;
      return `<section class="card space-y-3"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-base sm:text-lg font-extrabold cursor-help" data-tip="Erstelle beliebige Sektionen (Ordner), ziehe Kräfte am Viereck ⠿ hinein oder sammle Kräfte nach Art.\nÜber 🎨 (Textfarbe) und 🪟 (Fensterfarbe) lassen sich Kräfte, Augmente und Sektionen frei einfärben.">Kräfte &amp; Augmente</h2><p class="text-xs t-mut">Aktuelle Kosten: <strong id="pwSummaryHdr" class="text-acc">${P.pwSp} SP${P.pwMsp?` + ${P.pwMsp} MsP`:''}</strong></p></div><div class="flex flex-wrap items-center gap-2"><button type="button" data-action="toggle-pw-filter" data-tip="Kräfte &amp; Augmente nach Kraft-Art, Lernkosten-Stufe oder Unterkategorie live filtern" class="btn py-1 px-2.5 text-xs ${(UI.pwFilterOpen||fAct)?'bdr-acc bg-acc-soft text-acc font-extrabold':''}">🔍 Filter${fAct?` (${fCnt})`:''} ${UI.pwFilterOpen?'▴':'▾'}</button>${fAct&&!UI.pwFilterOpen?`<button type="button" data-action="reset-pw-filter" data-tip="Aktiven Kräfte-Filter zurücksetzen" class="btn btn-err py-1 px-2 text-xs">✕</button>`:''}${hasAny?`<button type="button" data-action="collapse-all-pw" data-val="1" class="btn py-1 px-2.5 text-xs">▸ Alle einklappen</button><button type="button" data-action="collapse-all-pw" data-val="0" class="btn py-1 px-2.5 text-xs">▾ Alle ausklappen</button>`:''}<button type="button" data-action="add-pw-section" class="btn bg-acc-soft bdr-acc text-acc">+ Sektion</button><button type="button" data-action="add-power" class="btn btn-pri">+ Kraft</button><button type="button" data-action="add-augment" class="btn border-amber-400 text-amber-500">+ Freies Augment</button></div></div>${filterMenuHtml}${activeTagsHtml}</section>
      ${!hasAny?`<div class="card text-center py-8 text-xs t-mut">Noch keine Sektionen, Kräfte oder Augmente vorhanden.</div>`:''}
      ${fAct&&totalMatchedCnt===0?`<div class="card text-center py-8 space-y-2 text-xs t-mut"><div class="font-extrabold text-sm text-acc">Keine Kräfte oder Augmente mit Überschneidung zum gewählten Filter gefunden.</div><div>Passe die Filterauswahl oben an oder setze den Filter zurück.</div><div><button type="button" data-action="reset-pw-filter" class="btn btn-pri py-1 px-3 text-xs mt-1">↺ Filter zurücksetzen</button></div></div>`:''}
      ${rootSecs.length?`<div class="space-y-5">${rootSecs.map((sec,sIdx)=>renderPwSection(sec,sIdx,rootSecs.length,0)).join('')}</div>`:''}
      ${unsecPowers.length?`<div data-pw-sec="" class="space-y-5 ${rootSecs.length?'pt-2':''}">${S.powerSections.length?`<div class="flex items-center justify-between px-1"><h3 class="text-sm font-extrabold t-mut">Kräfte ohne Sektion (${fAct?`${unsecPowers.length}/${allUnsecPowers.length}`:unsecPowers.length})</h3><span class="text-[11px] t-mut">Hierher ziehen zum Herauslösen aus einer Sektion</span></div>`:''}${renderPwGroupList(unsecPowers)}</div>`:(S.powerSections.length&&S.powers.length&&!fAct?`<div data-pw-sec="" class="subcard border-dashed text-center py-3 text-xs t-mut">Hierher ziehen, um eine Kraft aus einer Sektion herauszulösen</div>`:'')}
      ${unlinked.length?`<section class="space-y-3 pt-2"><h3 class="text-sm font-extrabold text-amber-400 px-1">Ungebundene Augmente (${fAct?`${unlinked.length}/${allUnlinked.length}`:unlinked.length})</h3>${unlinked.map((ag,ai)=>renderPwCard('augment',ag,'',ai,unlinked.length)).join('')}</section>`:''}`;
    }

    function buildPwCatPillsHtml(){
      const st={marginal:{c:0,sp:0,m:0},fundamental:{c:0,sp:0,m:0},grandios:{c:0,sp:0,m:0}};
      [...S.powers,...S.augments].filter(it=>it.tier!=='basisaktion').forEach(it=>{const k=PW_TIERS[it.tier]?it.tier:'marginal',c=calcPwCost(it);if(!st[k])st[k]={c:0,sp:0,m:0};st[k].c++;st[k].sp+=c.sp;st[k].m+=c.msp;});
      return Object.entries(PW_TIERS).filter(([k])=>k!=='basisaktion').map(([k,t])=>`<span class="subcard py-1 px-2.5 text-[11px] font-bold inline-flex gap-1.5 tabular"><strong class="text-acc">${t.l}:</strong> ${st[k].c}× (${st[k].sp} SP${st[k].m?` + ${st[k].m} MsP`:''})</span>`).join('');
    }

    function renderChrSection(secKey,secIdx,totalSecs,P,activeTrRows,trainedAttrCnt,allPw){
      const meta=S.chrSecMeta?.[secKey]||{collapsed:false,color:'',bgColor:''};
      const colStyle=meta.color?`style="color:${esc(meta.color)}"`:'', winStyle=cardColorStyle(meta);
      const hdrCommon=(titleHtml,tipTxt,extraLeftHtml,rightHtml)=>`<div class="flex flex-wrap items-center justify-between gap-2 ${meta.collapsed?'':'border-b bdr-line pb-2'}">
        <div class="flex flex-wrap items-center gap-1.5">
          <button type="button" data-action="toggle-chrsec-collapse" data-sec="${secKey}" data-tip="${meta.collapsed?'Fenster ausklappen':'Fenster einklappen'}" class="btn w-7 h-7 p-0 text-xs font-black shrink-0">${meta.collapsed?'▸':'▾'}</button>
          <span draggable="true" data-drag-chrsec="${secKey}" data-tip="Ziehen zum Verschieben des Fensters" class="w-7 h-7 rounded bg-acc-soft border bdr-acc text-acc text-xs font-black cursor-grab select-none shrink-0 inline-flex items-center justify-center">⠿</span>
          <h3 class="text-base font-extrabold cursor-help" ${colStyle} data-tip="${tipTxt}">${titleHtml}</h3>

        <div class="flex flex-wrap items-center gap-1.5">
          ${rightHtml}
          <button type="button" data-action="move-chrsec" data-sec="${secKey}" data-dir="-1" ${secIdx===0?'disabled':''} data-tip="Fenster nach oben verschieben" class="btn py-1 px-2 text-xs">▲</button>
          <button type="button" data-action="move-chrsec" data-sec="${secKey}" data-dir="1" ${secIdx===totalSecs-1?'disabled':''} data-tip="Fenster nach unten verschieben" class="btn py-1 px-2 text-xs">▼</button>

      if(secKey==='training'){
        const grpBtns=trainedAttrCnt>0?`<button type="button" data-action="toggle-all-tr-grp" data-val="1" class="btn py-0.5 px-2 text-xs">▾ Alle Stufen aufklappen</button><button type="button" data-action="toggle-all-tr-grp" data-val="0" class="btn py-0.5 px-2 text-xs">▸ Alle Stufen zuklappen</button>`:'';
        return `<section data-chrsec="training" class="card space-y-3" ${winStyle}>
          ${hdrCommon('Training','Block 1 & 2: je 2 SP (+5)\nBlock 3 & 4: je 3 SP (+5)\nBlock 5: 5 SP + 1 MsP (+10)\nIn der Tabelle pro Attribut zusammengefasst; per Klick auf ▸ lassen sich die einzelnen Stufen aufklappen & editieren.',grpBtns,`<span id="chrTrBadge" class="pill cursor-default text-acc tabular">${P.trSp} SP | ${P.trMsp||'-'} MsP</span>`)}
          ${!meta.collapsed?`<div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2.5">${ATTRS.map(a=>`<div class="subcard p-2.5 space-y-1.5" style="--ac:${getAttrCol(a.k)}"><div class="flex justify-between text-xs font-extrabold"><span style="color:${getAttrCol(a.k)}">${a.k}</span><span class="tabular">+${getTrBonus(a.k)}</span></div>${renderTrPairs(a.k,a.n,'Steigerungschronik')}</div>`).join('')}</div>
