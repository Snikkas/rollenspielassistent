<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scherbensturm – Digitaler Charakter- &amp; Würfelassistent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}};</script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="min-h-screen">
  <div id="bgLayer"></div><div id="bgScrim"></div>
  <div id="hdrMount" class="sticky top-0 z-30"></div>
  <div id="layoutWrap" class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 pt-5 pb-24 flex flex-col xl:flex-row gap-5 items-start">
    <main id="mainMount" class="w-full flex-1 min-w-0 space-y-5"></main>
    <div id="notesBackdrop" data-action="close-cnotes" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden cursor-pointer"></div>
    <aside id="notesMount" class="hidden"></aside>
    <div id="liveDiceBackdrop" data-action="close-livedice" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden cursor-pointer"></div>
    <aside id="liveDiceMount" class="hidden"></aside>
    <div id="iniBackdrop" data-action="close-ini" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden cursor-pointer"></div>
    <aside id="iniMount" class="hidden"></aside>
    <div id="diceBackdrop" data-action="close-dice" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden cursor-pointer"></div>
    <aside id="diceMount" class="hidden"></aside>
    <div id="fbAdminBackdrop" data-action="close-fbadmin" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden cursor-pointer"></div>
    <aside id="fbAdminMount" class="hidden"></aside>
  </div>
  <div id="modalMount"></div>
  <div id="duelReplyMount"></div>
  <div id="ctxMenuMount"></div>
  <div id="duelBannerMount" class="duel-banner-stack" aria-live="polite"></div>
  <button type="button" data-action="open-info" data-tip="Regel-Wiki (Würfelsystem, Steigerung, Glossar) &amp; Patchnotes" class="fixed bottom-5 left-5 z-40 w-12 h-12 rounded-2xl btn-pri font-serif italic font-black text-2xl shadow-xl">i</button>
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[90] px-4 py-2 rounded-xl bg-slate-900 text-white border border-slate-700 text-xs font-bold shadow-xl opacity-0 transition-opacity duration-200"></div>
  <div id="tooltip" class="fixed z-[90] max-w-[calc(100vw-24px)] sm:max-w-xs px-3 py-2 rounded-xl text-xs font-medium bg-slate-950/95 text-slate-100 border border-slate-700 shadow-2xl opacity-0 transition-opacity duration-150" style="top:-9999px;left:-9999px"></div>
  <input id="fileAvatar" type="file" accept="image/*" class="hidden" /><input id="fileBg" type="file" accept="image/*" class="hidden" /><input id="fileItemImg" type="file" accept="image/*" class="hidden" /><input id="fileBioImg" type="file" accept="image/*" class="hidden" /><input id="fileImport" type="file" accept=".json,application/json" class="hidden" /><input id="filePwImport" type="file" accept=".json,application/json" class="hidden" /><input id="fileLobbyLogo" type="file" accept="image/*" class="hidden" /><input id="fileCampImg" type="file" accept="image/*" class="hidden" /><input id="fileUserAvatar" type="file" accept="image/*" class="hidden" /><input id="fileAdminIcon" type="file" accept="image/png,image/webp,image/svg+xml,image/jpeg,image/gif,image/*" class="hidden" />
  <script type="module" src="./js/app.js"></script>
</body>
</html>
